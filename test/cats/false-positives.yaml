# CATS false-positive rules for TMI.
#
# Ported from scripts/parse_cats_results.py, detect_false_positive()
# (git history up to and including PR "eliminate /admin/audit/* CATS
# false-positive 400s"). Rules are evaluated in *file order*, first match
# wins — this mirrors the legacy function's sequential if-chain with early
# returns, so rule position here is load-bearing. Do not reorder rules
# without re-verifying against the legacy behavior.
#
# NOTE on deliberate divergence (#586): CONNECTION_ERROR_999 was moved from
# its ported position to rule 1 so that no application-layer rule can claim
# a transport-layer failure (response code 953/999) under first-match-wins.
# This is an intentional break from the legacy port's ordering, not a bug.
# test/cats/rule-baseline.json — captured before this change — is the
# behavioral reference for everything except that reordering; it is stale
# with respect to CONNECTION_ERROR_999's position and the XSS_QUERY_PARAMS
# guard added in the same change, pending regeneration.
#
# NOTE on scope: this file originally ported 62 distinct FP_RULE_* ids from
# the legacy detect_false_positive() (not 43 — the constant list had grown via
# many follow-up commits since whatever revision had 43). Rules added since
# the port are appended in file order.
#
# NOTE on dead conditions: the CATS result JSON has no top-level
# `response.responseBody` key (only `response.jsonBody`), so every legacy
# sub-condition that read `data['response']['responseBody']` was
# unreachable dead code. Those sub-conditions are omitted here; each
# affected rule carries a comment recording what was dropped.
#
# NOTE on rule numbering: each rule's leading comment reads "rule N of <total>",
# where N is the rule's actual position in this file (1-indexed, matching
# evaluation order — first match wins). If you add, remove, or reorder a rule,
# renumber every comment (and the total) to match.
# `scripts/check-cats-fp-numbering.py` (run by `make lint`) fails the build
# when any comment disagrees with a rule's real position.
#
# NOTE on inert conditions: STRING_BOUNDARY_EMPTY_PATH carries an inherited
# legacy condition that never actually constrains anything against the real
# corpus. It is marked INERT CONDITION at its definition. (The other two
# holders of such a condition, EMPTY_PATH_PARAM_405 and IDOR_LIST, were
# removed with the rest of the dead rules under #585.)
# See test/cats/rule-baseline.json for the numbers and
# docs/superpowers/plans/2026-07-26-cats-rule-migration-report.md for
# background. These are known, deliberate carry-overs, not new bugs; do not
# "fix" them without checking that plan for the associated follow-up issue.
version: 1
rules:
  # 999 indicates a connection error or malformed request that never got a
  # real HTTP response (often a URL-encoding issue in a path parameter).
  # 953 indicates connection refused (server temporarily unreachable).
  # Both are CATS/network issues, not API bugs. Positioned first (#586): a
  # transport-layer failure is categorically not an application-layer
  # finding, so no application rule may claim these records under
  # first-match-wins.
  # rule 1 of 94:
  - id: CONNECTION_ERROR_999
    why: Response codes 953/999 are CATS/network-layer issues (connection refused, no real HTTP response received), not API bugs.
    when:
      response_code: { in: [953, 999] }

  # rule 2 of 94: Rate Limit False Positives (429)
  # Rate limiting is infrastructure protection, not API behavior.
  - id: RATE_LIMIT_429
    why: Rate limiting is infrastructure protection, not API behavior.
    when:
      response_code: 429

  # BypassAuthentication is the ONLY CATS fuzzer that attacks the auth
  # header (every other header fuzzer explicitly preserves authentication
  # headers). A 401/403 when credentials were deliberately removed is the
  # correct security outcome. Any other 401/403 must surface. (#583)
  # rule 3 of 94:
  - id: AUTH_BYPASS_401_403
    why: BypassAuthentication deliberately strips the Authorization header, so a 401/403 rejection is the correct security outcome; CATS preserves auth headers in every other fuzzer, so no other fuzzer legitimately triggers auth failures.
    when:
      fuzzer: BypassAuthentication
      response_code: { in: [401, 403] }

  # TMI has explicit security hardening middleware that rejects zero-width
  # chars, bidirectional overrides, Hangul fillers, Zalgo text, control
  # chars, and similar malformed/adversarial input. Returning 400 for these
  # is correct security behavior, not a bug.
  # rule 4 of 94:
  - id: VALIDATION_400
    why: TMI's security hardening middleware correctly rejects malformed/adversarial input (unicode abuse, injection payloads, overflow values, malformed JSON) with 400.
    when:
      response_code: 400
    any_of:
      - fuzzer:
          in:
            - ZeroWidthCharsInValuesFields
            - ZeroWidthCharsInNamesFields
            - HangulCharsInStringFields
            - ArabicCharsInStringFields
            - HangulFillerFields
            - BidirectionalOverrideFields
            - ZalgoTextInFields
            - AbugidasInStringFields
            - FullwidthBracketsFields
            - SpecialCharsInStringFields
            - ControlCharsInStringFields
            - EmojisInStringFields
            - TrailingSpacesInFields
            - LeadingSpacesInFields
            - OverflowArraySizeFields
            - ExtremeNegativeNumbersInNumericFields
            - ExtremePositiveNumbersInNumericFields
            - VeryLargeStrings
            - VeryLargeUnicodeStrings
            - MalformedJson
            - DuplicateKeysFields
            - InvalidJsonInRequestBody
            - NullValuesInFields
            - EmptyStringsInFields
            - SQLInjection
            - XSSInjection
            - PathTraversal
      - fuzzer:
          contains_any:
            - injection
            - overflow
            - chars
            - unicode
            - malformed
            - hangul
            - zalgo
            - bidirectional
            - fullwidth
            - abugida

  # Expected when fuzzing with random/invalid resource IDs — all implemented
  # endpoints correctly return 404 for non-existent resources.
  # NOTE: legacy also checked response.responseBody against
  # legitimate_not_found_messages, which CATS never emits (dead branch);
  # only the result_details check (which reads the same message list) is live.
  # rule 5 of 94:
  - id: NOT_FOUND_404
    why: Fuzzers that substitute random/invalid resource IDs correctly get 404 from fully-implemented endpoints.
    when:
      response_code: 404
    any_of:
      - fuzzer:
          in:
            - RandomResourcesFuzzer
            - InsecureDirectObjectReferences
            - RandomForeignKeyReference
            - NonExistentResource
            - RandomResources
            - AcceptLanguageHeaders
            - CheckSecurityHeaders
            - DuplicateHeaders
            - ExtraHeaders
            - HappyPath
            - LargeNumberOfRandomAlphanumericHeaders
            - NewFields
            - InvalidReferencesFields
            - ZeroWidthCharsInValuesFields
            - HangulFillerFields
            - AbugidasInStringFields
            - FullwidthBracketsFields
            - IterateThroughEnumValuesFields
            - RemoveFields
            - DefaultValuesInFields
            - ExtremePositiveNumbersInIntegerFields
            - ExtremeNegativeNumbersInIntegerFields
            - IntegerFieldsRightBoundary
            - LeadingSpacesInHeaders
            - MaxLengthExactValuesInStringFields
            - TrailingSpacesInHeaders
            - EmptyStringsInFields
            - ExamplesFields
            - MaximumExactNumbersInNumericFields
            - MinLengthExactValuesInStringFields
            - MinimumExactNumbersInNumericFields
            - NullValuesInFields
            - RemoveHeaders
            - StringFieldsLeftBoundary
            - StringFieldsRightBoundary
            - VeryLargeStringsInFields
      # The "unexpected response code: 404" branch that used to sit here was
      # CATS's default message for ANY status mismatch and so reduced the whole
      # rule to "every 404 is fine" (#584). Removed: on the 20260728T042755Z
      # corpus the fuzzer list below already covered 3288 of 3288 matches, so
      # nothing this rule legitimately suppressed is lost -- but a 404 from a
      # fuzzer that does NOT substitute a resource id now surfaces.
      - result_details:
          contains_any:
            - "not found"
            - "add-on not found"
            - "invocation not found"
            - "user not found"
            - "group not found"
            - "webhook not found"
            - "threat model not found"
            - "diagram not found"
            - "document not found"
            - "threat not found"
            - "not defined in the api specification"

  # InsecureDirectObjectReferences replaces ID fields with alternative
  # values. Admin endpoints (and the admin-only DELETE /addons/{id}) grant
  # full access regardless of which ID is used, so this is expected.
  # rule 6 of 94:
  - id: IDOR_ADMIN
    why: Admin endpoints (and admin-only DELETE /addons/{id}) grant full access regardless of which ID is substituted, so IDOR probing them is expected to "succeed".
    when:
      fuzzer: InsecureDirectObjectReferences
    any_of:
      - path:
          starts_with: /admin/
      - path:
          starts_with: /addons/
        method: DELETE

  # CATS POST fuzzers may create additional resources (e.g. client
  # credentials) owned by the same test user; the IDOR fuzzer then reuses
  # those IDs. Since the replacement resource is also owned by the same
  # user, success is expected — ownership is enforced via
  # WHERE owner_uuid = ? in all queries.
  # rule 7 of 94:
  - id: IDOR_SAME_OWNER
    why: /me/ endpoints are single-user scoped; a substituted ID that also belongs to the same authenticated user is a same-owner access, not an IDOR — ownership is enforced via WHERE owner_uuid = ? in all queries.
    when:
      fuzzer: InsecureDirectObjectReferences
      path:
        starts_with: /me/
      response_code: { in: [200, 204] }

  # Returning 400/405 for unsupported HTTP methods is correct behavior.
  # rule 8 of 94:
  - id: HTTP_METHODS
    why: Returning 400/405 for unsupported HTTP methods is correct behavior.
    when:
      fuzzer: { in: [HttpMethods, NonRestHttpMethods, CustomHttpMethods] }
      response_code: { in: [400, 405] }

  # When fuzzers send malformed requests, Go's net/http package may reject
  # the request at the transport layer before it reaches Gin middleware,
  # returning "400 Bad Request" as text/plain rather than JSON. The spec
  # allows text/plain as an alternative for 400, but CATS may not recognize
  # it (charset suffix, or only checking the first content type).
  # rule 9 of 94:
  - id: CONTENT_TYPE_GO_HTTP
    why: Go's net/http layer can reject a malformed request before Gin middleware runs, returning text/plain "400 Bad Request" instead of JSON — expected HTTP behavior, not a bug.
    when:
      any_text:
        contains: "content type not matching"
      response_content_type:
        starts_with: text/plain
      response_code: 400

  # TMI is a JSON API, not an HTML-rendering application. "Payload
  # reflected in response" means data was stored and returned as JSON —
  # that's not XSS, which requires HTML context. NoSQL/command injection
  # "potential" findings are storage, not execution. NoSQL syntax has no
  # effect on TMI's PostgreSQL backend.
  # rule 10 of 94:
  - id: INJECTION_JSON_API
    why: For a JSON API, storing and echoing user-supplied data as JSON is not XSS (which needs HTML context); NoSQL injection syntax has no effect on TMI's PostgreSQL backend.
    when:
      fuzzer:
        in:
          - XssInjectionInStringFields
          - NoSqlInjectionInStringFields
          - CommandInjectionInStringFields
          - SqlInjectionInStringFields
    any_of:
      - result_reason:
          contains_any: [reflected, potential]
      - fuzzer: NoSqlInjectionInStringFields
        result_reason:
          contains_any: [detected, vulnerability]

  # XSS requires HTML context to execute. TMI returns application/json.
  # GET requests only carry query parameters (no body), so XSS on GET is
  # never exploitable. A "warn" result on any method means the payload was
  # merely accepted, not reflected as HTML. Guarded (#586) to a real HTTP
  # status (1xx-5xx) so it can never claim a synthetic CATS connection-error
  # code (953/999) ahead of CONNECTION_ERROR_999 — on the current corpus this
  # guard is a no-op now that CONNECTION_ERROR_999 sits at rule 1, but it's
  # cheap defense-in-depth against a future reorder.
  # rule 11 of 94:
  - id: XSS_QUERY_PARAMS
    why: TMI returns JSON, not HTML, so XSS requires no exploitable context; GET-only query-parameter payloads and "warn"-level (accepted, not reflected-as-HTML) results are never exploitable. Restricted to real HTTP status codes (#586) so it can never claim a synthetic CATS code like 953/999.
    when:
      fuzzer: XssInjectionInStringFields
      response_code: { matches: "^[1-5][0-9][0-9]$" }
    any_of:
      - method: GET
      - result: warn

  # These fuzzers send malformed/unusual headers and expect success.
  # Returning 400 for invalid headers is correct input validation.
  # rule 12 of 94:
  - id: HEADER_VALIDATION_400
    why: Returning 400 for malformed/unusual headers (bad Accept-Language, invalid Content-Type, header flooding, duplicate/extra headers) is correct input validation.
    when:
      fuzzer:
        in:
          - AcceptLanguageHeaders
          - UnsupportedContentTypesHeaders
          - DummyContentLengthHeaders
          - LargeNumberOfRandomAlphanumericHeaders
          - DuplicateHeaders
          - ExtraHeaders
      response_code: 400

  # CATS sends empty strings for optional fields and expects 4XX. Empty
  # strings on optional fields (e.g. 'description') are valid — the API
  # correctly returns 2XX because the field is optional.
  # NOTE: the legacy condition was
  #   `'is required [FALSE]' in scenario.lower() or 'is required [false]' in scenario`
  # — `scenario` was already fully lowercased earlier in the function, so the
  # first disjunct (mixed-case needle "[FALSE]") can never match a
  # lowercased haystack; only the second, fully-lowercase disjunct is live.
  # Ported as a single condition; the engine's `contains` is
  # case-insensitive, so this matches exactly the same records as the
  # original OR.
  # rule 13 of 94:
  - id: STRING_BOUNDARY_OPTIONAL
    why: CATS expects 4XX for an empty string on an optional field, but an optional field accepting an empty value and returning 2XX is correct.
    when:
      fuzzer: StringFieldsLeftBoundary
      response_code: { in: [200, 201, 204] }
      scenario:
        contains: "is required [false]"

  # This fuzzer deletes a resource then checks it's no longer accessible.
  # For LIST endpoints, returning 200 with an empty array is correct REST
  # behavior — the fuzzer expects 404/410, but a list endpoint should
  # return 200 with empty results.
  # rule 14 of 94:
  - id: DELETED_RESOURCE_LIST
    why: LIST endpoints correctly return 200 with an empty array after the listed resource is deleted, rather than 404/410.
    when:
      fuzzer: CheckDeletedResourcesNotAvailable
    any_of:
      - path:
          starts_with: /me/client_credentials
      - path:
          starts_with: /admin/quotas/users/
      - path:
          equals: /admin/quotas/users
      - path:
          starts_with: /admin/quotas/addons/
      - path:
          equals: /admin/quotas/addons
      - path:
          starts_with: /admin/quotas/webhooks/
      - path:
          equals: /admin/quotas/webhooks

  # MalformedJson/DuplicateKeysFields/RandomDummyInvalidJsonBody test
  # JSON-specific issues, but some endpoints (e.g. /oauth2/revoke per RFC
  # 7009) accept form-urlencoded data. When the request Content-Type is
  # form-urlencoded, the server correctly handles the form data — the
  # fuzzers are testing the wrong content type.
  # rule 15 of 94:
  - id: FORM_URLENCODED_JSON_TEST
    why: JSON-body fuzzers (MalformedJson, DuplicateKeysFields, RandomDummyInvalidJsonBody) test the wrong content type against endpoints that legitimately accept form-urlencoded data (e.g. /oauth2/revoke per RFC 7009).
    when:
      fuzzer: { in: [MalformedJson, DuplicateKeysFields, RandomDummyInvalidJsonBody] }
      request_header.content-type:
        contains: application/x-www-form-urlencoded

  # DELETE /me is a two-step deletion: the first call (no challenge) returns
  # 200 with a challenge string, the second (with challenge) confirms
  # deletion. Fuzzers that send DELETE /me without the challenge parameter
  # correctly get 400 "Invalid or expired challenge".
  # rule 16 of 94:
  - id: DELETE_ME_CHALLENGE
    why: DELETE /me requires a two-step challenge flow; any 400 without the challenge parameter correctly enforces that flow.
    when:
      response_code: 400
      path:
        equals: /me
      method: DELETE

  # CATS uses parameter names like "cats-test-key" containing hyphens, but
  # OpenAPI patterns like ^[a-z][a-z0-9_.]*$ don't allow hyphens — 400 is
  # correct path-parameter format validation.
  # NOTE: legacy also checked response.responseBody for the same
  # "parameter ... doesn't match the regular expression" message, which
  # CATS never emits (dead branch).
  # rule 17 of 94:
  - id: PATH_PARAM_VALIDATION
    why: CATS test parameter names (e.g. "cats-test-key") contain hyphens that some OpenAPI path-parameter regex patterns disallow; 400 is correct validation.
    when:
      response_code: 400
      json_body.error_description:
        contains_all:
          - "openapi3filter.requesterror: parameter"
          - "doesn't match the regular expression"

  # EmptyJsonBody sends {} when required fields are documented — 400 for
  # missing required properties is correct.
  # NOTE: legacy also checked response.responseBody for the same "property
  # ... is missing" / "is required" messages (2 places), which CATS never
  # emits (dead branches); only the json_body.error_description checks are live.
  # rule 18 of 94:
  - id: EMPTY_BODY_REQUIRED_FIELDS
    why: EmptyJsonBody sends {} against endpoints with documented required fields; 400 for a missing required property is correct.
    when:
      fuzzer: EmptyJsonBody
      response_code: 400
    any_of:
      - json_body.error_description:
          contains_all: [property, "is missing"]
      - json_body.error_description:
          contains: "is required"

  # EmptyJsonBody uses random UUIDs that don't exist in the database — 404
  # is correct and unrelated to the empty body itself.
  # rule 19 of 94:
  - id: EMPTY_JSON_BODY_NOT_FOUND
    why: EmptyJsonBody's random UUIDs don't exist in the database; 404 Not Found is correct and unrelated to the empty request body.
    when:
      fuzzer: EmptyJsonBody
      response_code: 404
    any_of:
      - json_body.error_description:
          contains_any: ["not found", "does not exist", "no such"]
      - result_reason:
          contains: "not found"

  # An empty string for a path parameter changes the URL (e.g.
  # /admin/settings/{key} becomes /admin/settings/), which routes to a
  # different endpoint (list vs item): 200 for GET on the list endpoint, or
  # 405 for methods the list endpoint doesn't support.
  #
  # INERT CONDITION (inherited from legacy): every CATS request URL starts
  # with "http://", so `url: {contains: "//"}` below is vacuously true for
  # every classified record and constrains nothing. Because it's one arm of
  # an `any_of`, that always-true disjunct makes the whole any_of always
  # true, so this rule effectively reduces to: fuzzer=StringFieldsLeftBoundary
  # AND response_code in (200, 405). Do not restore or rely on this
  # condition as a real empty-path guard — it is a faithful port of a legacy
  # no-op check, kept only for behavioral equivalence with the ported
  # Python. See test/cats/rule-baseline.json and
  # docs/superpowers/plans/2026-07-26-cats-rule-migration-report.md.
  # rule 20 of 94:
  - id: STRING_BOUNDARY_EMPTY_PATH
    why: In practice this rule fires whenever StringFieldsLeftBoundary gets response_code 200 or 405 — the url any_of below is inert (see comment above), so it does not actually gate on an empty path segment despite the historical framing.
    when:
      fuzzer: StringFieldsLeftBoundary
      response_code: { in: [200, 405] }
    any_of:
      - url:
          ends_with: "/"
      - url:
          contains: "//"

  # Some endpoints (e.g. /admin/settings/migrate) don't accept a request
  # body — sending one correctly returns 400.
  # NOTE: legacy also checked response.responseBody for "does not accept a
  # request body", which CATS never emits (dead branch).
  # rule 21 of 94:
  - id: NO_BODY_ENDPOINT
    why: Endpoints that don't accept a request body (e.g. /admin/settings/migrate) correctly return 400 when a fuzzer sends one anyway.
    when:
      response_code: 400
      json_body.error_description:
        contains: "does not accept a request body"

  # rule 22 of 94: Survey endpoint validation false positives (400)
  # Survey POST/PUT correctly rejects malformed survey_json, status, etc.
  - id: SURVEY_VALIDATION_400
    why: Survey POST/PUT correctly rejects malformed survey_json, status, and other fuzzed fields with 400.
    when:
      response_code: 400
      path:
        contains: /admin/surveys
      method: { in: [POST, PUT] }
      # Was the meaningless `unexpected response code` reason (#584); these cover 36 of 36 matches.
      response_body:
        contains_any:
          - survey_json must contain
          - Duplicate metadata key found
          - request body has an error

  # Deleting a survey with existing responses correctly returns 409.
  # rule 23 of 94:
  - id: SURVEY_DELETE_CONFLICT_409
    why: Deleting a survey that has existing responses correctly returns 409 Conflict (referential integrity).
    when:
      response_code: 409
      path:
        contains: /admin/surveys/
      method: DELETE

  # rule 24 of 94: JSON Patch validation false positives (400)
  # PATCH endpoints correctly reject malformed/empty JSON Patch operations.
  - id: JSONPATCH_INVALID_400
    why: PATCH endpoints correctly reject malformed or inapplicable JSON Patch documents with 400, matched on the server's actual rejection rather than the status code alone.
    when:
      response_code: 400
      method: PATCH
      # Was `result_reason: contains "unexpected response code"` with no path
      # constraint -- CATS's default status-mismatch message, so the rule meant
      # "any 400 on any PATCH anywhere" (#584). These markers covered 334 of
      # 334 matches on the 20260728T042755Z corpus.
      response_body:
        contains_any:
          - patch_failed
          - request body has an error
          - Invalid request body
          - multiple errors encountered
          - Duplicate metadata key found

  # rule 25 of 94: Survey response endpoint validation false positives (400)
  # Survey response POST/PUT correctly rejects fuzzed input.
  - id: SURVEY_RESPONSE_VALIDATION_400
    why: Survey response POST/PUT correctly rejects fuzzed input with 400.
    when:
      response_code: 400
      path:
        contains: /survey_responses
      method: { in: [POST, PUT] }
      # Was the meaningless `unexpected response code` reason (#584); these cover 10 of 10 matches.
      response_body:
        contains_any:
          - Referenced resource not found
          - request body has an error

  # rule 26 of 94: Bulk metadata validation false positives (400)
  # Bulk metadata endpoints correctly reject malformed payloads.
  - id: METADATA_BULK_VALIDATION_400
    why: Bulk metadata endpoints correctly reject malformed payloads with 400.
    when:
      response_code: 400
      path:
        contains: /metadata/bulk
      # Was the meaningless `unexpected response code` reason (#584); these cover 24 of 24 matches.
      response_body:
        contains_any:
          - request body has an error
          - Duplicate metadata key found

  # CATS warns "Not matching response schema" but our Error responses are
  # valid: the Error schema requires 'error' and 'error_description'
  # (details is nullable); OAuth endpoints may return just 'error' per RFC
  # 6749 5.2; and Go's HTTP layer's text/plain "400 Bad Request" gets
  # parsed by CATS as {"notAJson": "400 Bad Request"}.
  # rule 27 of 94:
  - id: SCHEMA_MISMATCH_VALID_ERROR
    why: CATS warns "Not matching response schema" but the response is actually a valid Error (error+error_description, an RFC 6749 5.2 error-only OAuth response, or Go's text/plain 400 parsed by CATS as notAJson).
    when:
      result: warn
      result_reason:
        contains: "not matching response schema"
    any_of:
      - json_body.error:
          exists: true
        json_body.error_description:
          exists: true
      - json_body.error:
          exists: true
        response_code: 400
      - json_body.notAJson:
          equals: "400 Bad Request"

  # CATS sends SSRF URLs (e.g. http://intranet) in non-URL fields (boolean,
  # integer). The OpenAPI validation middleware correctly rejects with 400
  # and echoes the invalid value in the error description — the server
  # never attempts to connect to the URL; the "reflection" is only in the
  # validation error text.
  # rule 28 of 94:
  - id: SSRF_VALIDATION_400
    why: The OpenAPI validation middleware echoes an SSRF payload back in a 400 error description without ever attempting to connect to it — reflection in a validation message is not SSRF.
    when:
      fuzzer: { in: [SSRFInUrlFields, SsrfInjectionInStringFields] }
      response_code: 400

  # ExamplesFields sends the OpenAPI example survey, which collides with
  # seed data already in the database — 409 Conflict is correct.
  # rule 29 of 94:
  - id: SURVEY_EXAMPLES_CONFLICT_409
    why: The OpenAPI example survey sent by ExamplesFields collides with pre-seeded survey data; 409 Conflict is correct.
    when:
      response_code: 409
      fuzzer: ExamplesFields
      path:
        contains: /admin/surveys

  # CATS seeding creates metadata entries; a valid POST to
  # /admin/surveys/{id}/metadata correctly returns 409 because the metadata
  # key already exists from seeding.
  # rule 30 of 94:
  - id: SURVEY_METADATA_CONFLICT_409
    why: CATS seed data already created the survey metadata key being POSTed; 409 Conflict is correct, not a bug.
    when:
      response_code: 409
      path:
        contains_all: ["/admin/surveys/", "/metadata"]
      method: POST

  # EmptyJsonArrayBody sends [] to bulk endpoints — an empty array means
  # "no operations to perform", so 200 is correct.
  # rule 31 of 94:
  - id: EMPTY_ARRAY_BODY_200
    why: An empty JSON array body to a bulk endpoint means "no operations to perform"; 200 is the correct no-op response.
    when:
      fuzzer: EmptyJsonArrayBody
      response_code: 200

  # CATS generates all AddonParameter fields simultaneously regardless of
  # the `type` discriminator (e.g. a "boolean" type with enum_values and a
  # mismatched default_value, or a "number" type with string constraints).
  # The server correctly rejects these with 400 — CATS cannot generate
  # valid discriminated-union data for this schema.
  # NOTE: legacy also assigned response.responseBody in this block but
  # never referenced it in a condition — an unused local, not a dead check,
  # so there is nothing to omit here.
  # rule 32 of 94:
  - id: ADDON_PARAMETER_VALIDATION_400
    why: CATS cannot generate valid discriminated-union AddonParameter data (fields for every `type` variant are generated simultaneously); the server correctly rejects the resulting invalid combinations with 400.
    when:
      response_code: 400
      path:
        equals: /addons
      json_body.error_description:
        contains_any:
          - default_value
          - enum_values
          - "must not have"
          - number_min
          - number_max
          - string_max_length
          - string_validation_regex
          - metadata_key
          - "parameter '"

  # rule 33 of 94: RFC 7009 Section 2.1: the token revocation endpoint SHOULD return 200
  # even for invalid/malformed tokens. String boundary and large string
  # fuzzers flag this as an error because they expect 4xx for bad input,
  # but 200 is the RFC-compliant behavior.
  - id: REVOKE_STRING_BOUNDARY_RFC7009
    why: "RFC 7009 2.1: /oauth2/revoke SHOULD return 200 even for malformed tokens, so string-boundary/large-string fuzzers expecting 4xx are false positives."
    when:
      result: error
      path:
        contains: /oauth2/revoke
      fuzzer:
        contains_any:
          - StringFieldsRightBoundary
          - VeryLargeStringsInFields
          - VeryLargeUnicodeStringsInFields

  # RFC 7009 requires returning 200 even for malformed tokens. Type-coerced
  # values in client_id, client_secret, or token fields correctly return
  # 200 — there is no valid token to revoke, so the server responds with
  # success per the RFC.
  # rule 34 of 94:
  - id: REVOKE_TYPE_COERCION_RFC7009
    why: "RFC 7009 requires 200 even for malformed tokens; type-coerced numeric/boolean values in client_id/client_secret/token correctly return 200 since there's no valid token to revoke."
    when:
      result: error
      path:
        contains: /oauth2/revoke
      fuzzer: { in: [NumericValuesInStringFields, BooleanValuesInStringFields] }

  # Go's HTTP framework returns 200 for HEAD requests (mirroring GET/POST),
  # and the revoke endpoint's permissive error handling per RFC 7009 means
  # it gracefully handles unexpected methods.
  # rule 35 of 94:
  - id: REVOKE_HTTP_METHODS_RFC7009
    why: Go's HTTP framework returns 200 for HEAD (mirroring GET/POST), and RFC 7009's permissive error handling means undocumented methods on /oauth2/revoke are handled gracefully.
    when:
      result: error
      path:
        contains: /oauth2/revoke
      fuzzer:
        contains: HttpMethods

  # POST /admin/users/automation returns 409 when the automation account
  # already exists from CATS seed data.
  # rule 36 of 94:
  - id: AUTOMATION_ACCOUNT_CONFLICT_409
    why: POST /admin/users/automation correctly returns 409 when the automation account already exists from CATS seed data.
    when:
      response_code: 409
      path:
        equals: /admin/users/automation
      method: POST

  # RFC 7662 requires introspection to return HTTP 200 with
  # {"active":false} for any invalid, expired, or unrecognizable token.
  # rule 37 of 94:
  - id: INTROSPECT_RFC7662
    why: "RFC 7662 2.2 requires introspection to return HTTP 200 with {\"active\":false} for any invalid/expired/unrecognizable token; CATS expects 4xx for fuzzed input."
    when:
      result: error
      response_code: 200
      path:
        equals: /oauth2/introspect

  # These endpoints require valid OAuth parameters (code, state,
  # refresh_token, client_id, etc.) that CATS cannot generate — 400 is
  # correct validation, not a bug.
  # rule 38 of 94:
  - id: OAUTH_TOKEN_VALIDATION_400
    why: /oauth2/token, /oauth2/callback, and /oauth2/refresh require valid OAuth parameters CATS cannot generate; 400 is correct validation.
    when:
      result: error
      response_code: 400
      path: { in: [/oauth2/token, /oauth2/callback, /oauth2/refresh] }

  # rule 39 of 94: /oauth2/token returns 401 invalid_client per RFC 6749 5.2 when
  # client credentials don't authenticate. IterateThroughEnumValuesFields
  # iterates grant_type=client_credentials with synthetic client_id/secret;
  # the server correctly rejects unknown clients with 401 invalid_client.
  # This is required protocol behavior, not a bug.
  - id: OAUTH_TOKEN_INVALID_CLIENT_401
    why: "RFC 6749 5.2: the server correctly rejects unknown/synthetic client_credentials with 401 invalid_client — required protocol behavior, not a bug."
    when:
      result: error
      response_code: 401
      path:
        equals: /oauth2/token
      json_body.error:
        equals: invalid_client

  # Go's encoding/json decoder converts JSON numbers to Go string fields.
  # This is defined, safe behavior — the number becomes a string like
  # "9223372036854775807". No privilege escalation or data corruption occurs.
  # rule 40 of 94:
  - id: TYPE_COERCION_STRING
    why: Go's encoding/json decoder safely converts a JSON number into a Go string field; defined behavior with no privilege escalation or data corruption.
    when:
      result: error
      response_code: { in: [200, 201] }
      fuzzer: NumericValuesInStringFields

  # The webhook delivery endpoint uses dual auth (HMAC or JWT). When auth
  # is bypassed or headers are empty/spaces, the delivery is not found.
  # rule 41 of 94:
  - id: WEBHOOK_DELIVERY_AUTH_404
    why: /webhook-deliveries/{id} uses dual HMAC-or-JWT auth; bypassed or empty/whitespace auth headers correctly resolve to "delivery not found" (404).
    when:
      result: error
      response_code: 404
      path:
        contains: /webhook-deliveries/

  # EmptyBody -> 404 (subscription not found with empty body),
  # MaxLengthExactValues -> 400 (OpenAPI validation rejects oversized event_type).
  # rule 42 of 94:
  - id: WEBHOOK_TEST_VALIDATION
    why: The webhook subscription test endpoint correctly returns 404 for EmptyBody (subscription not found) and 400 for MaxLengthExactValues (oversized event_type rejected by OpenAPI validation).
    when:
      result: error
      response_code: { in: [400, 404] }
      path:
        contains_all: ["/webhooks/subscriptions/", "/test"]

  # CATS authenticates as charlie (admin) and tries to delete charlie's own
  # user account. The self-deletion guard correctly returns 409 Conflict.
  # rule 43 of 94:
  - id: SELF_DELETION_409
    why: CATS authenticates as the admin user (charlie) and attempts to delete that same account; the self-deletion guard correctly returns 409 Conflict.
    when:
      result: error
      response_code: 409
      path:
        contains: /admin/users/
      method: DELETE

  # This fuzzer expects 404 after deletion, but sometimes targets an
  # endpoint that exists as a path prefix yet doesn't accept the test's
  # HTTP method (e.g. GET on a DELETE-only collection item). 405 IS a 4XX
  # response and correct REST behavior — it tells the client the method is
  # not allowed on that resource.
  # rule 44 of 94:
  - id: CHECK_DELETED_405
    why: CheckDeletedResourcesNotAvailable expects 404, but a 405 (method not allowed on an existing path) is still a correct 4XX REST response, not a bug.
    when:
      result: error
      response_code: 405
      fuzzer: CheckDeletedResourcesNotAvailable

  # rule 45 of 94: /admin/audit/* query-parameter validation false positives (400) (#494)
  # The admin audit list endpoints take opaque query params (cursor,
  # actor_email, around, created_after/before). Injection/boundary fuzzers
  # send malformed values that the OpenAPI validation middleware correctly
  # rejects with 400 — most commonly a bad cursor pagination token. This
  # 400 is documented in the OpenAPI spec, so it's correct, in-contract
  # behavior.
  - id: AUDIT_QUERY_VALIDATION_400
    why: /admin/audit/* takes opaque query params (cursor, actor_email, around, created_after/before); OpenAPI validation correctly rejects fuzzer-mangled values (commonly a bad cursor) with the documented 400.
    when:
      response_code: 400
      path:
        starts_with: /admin/audit/
      method: GET
      # Was the meaningless `unexpected response code` reason (#584); the cursor message covers 26 of 26 matches.
      response_body:
        contains_any:
          - Invalid pagination cursor
          - request body has an error

  # rule 46 of 94: Step-up re-authentication 401 (#583)
  # Sensitive operations (identity link start, admin user transfer,
  # credential deletion) require recent re-authentication via the step-up
  # middleware; CATS's seeded token can never satisfy that requirement.
  - id: STEP_UP_AUTH_401
    why: Sensitive operations (identity link start, admin user transfer, credential deletion) require recent re-authentication via the step-up middleware; 401 insufficient_user_authentication is the deliberate step-up response and CATS's seeded token can never satisfy it.
    when:
      response_code: 401
      json_body.error:
        equals: insufficient_user_authentication

  # rule 47 of 94: Automation-only endpoints 403 (#583)
  # /automation/* endpoints are restricted to automation service accounts;
  # the CATS identity is an interactive admin, so 403 is the intended
  # authorization outcome.
  - id: AUTOMATION_ONLY_ENDPOINT_403
    why: /automation/* endpoints are restricted to automation service accounts; the CATS identity is an interactive admin, so 403 forbidden is the intended authorization outcome.
    when:
      response_code: 403
      path: { starts_with: /automation/ }
      json_body.error: { equals: forbidden }

  # rule 48 of 94: Admin client-credentials automation-account gate 403 (#583)
  # Admin client-credentials management is only available for automation
  # accounts; the seeded target user is a normal user, so 403 is the
  # intended outcome.
  - id: ADMIN_CLIENT_CREDENTIALS_AUTOMATION_ONLY_403
    why: Admin client-credentials management is only available for automation accounts; the seeded target user is a normal user, so 403 is the intended outcome.
    when:
      response_code: 403
      path: { starts_with: /admin/users/, contains: client_credentials }
      json_body.error_description:
        contains: only available for automation accounts

  # rule 49 of 94: Team/project uri field is stored, never fetched (#608 run 20260730T174620Z)
  # SSRFInUrlFields sets uri to an internal address and flags the echo in the
  # response body. Teams and projects only persist and serialize that field
  # (team_store_gorm.go:954) -- nothing dereferences it. Deliberately scoped to
  # these four contract paths: URIs ARE fetched for Timmy document/diagram
  # content (timmy_content_provider_http.go), and those findings must stay live.
  - id: TEAM_PROJECT_URI_REFLECTED_NOT_FETCHED
    why: Teams and projects store the user-supplied uri field and echo it back without ever dereferencing it, so a reflected SSRF payload is not a request the server made. Scoped to team/project paths only; Timmy content URIs are fetched and stay in scope.
    when:
      fuzzer: SSRFInUrlFields
      result_reason: { contains: SSRF payload reflected in response }
      contract_path:
        in: ["/teams", "/teams/{team_id}", "/projects", "/projects/{project_id}"]

  # rule 50: "unauthorized" is an error code, not leaked internals (run 20260730T174620Z)
  # All 39 hits are /saml/providers/{idp}/users returning the standard 401 body.
  # CATS's leak heuristic matched the word "unauthorized" in it.
  # rule 50 of 94:
  - id: AUTH_ERROR_CODE_IS_NOT_A_DETAILS_LEAK
    why: CATS flags the keyword "unauthorized" as a possible error-details leak, but that is the RFC 6749 error code itself and the body is the generic {"error":"unauthorized","error_description":"Authentication required"}. No internals are disclosed.
    when:
      result_reason: { contains: Error details leak }
      response_code: 401
      json_body.error: { equals: unauthorized }

  # rule 51: SSTI payload stored verbatim, never evaluated (run 20260730T174620Z)
  # 0 of 33 responses contained 8051 (the evaluated 83*97); all 33 contained the
  # literal payload. CATS's "engine" keyword matched our seeded member role
  # "engineering_lead". Requiring the unevaluated payload is what keeps this rule
  # honest: if a template engine ever does evaluate it, the body carries the
  # computed value instead, the rule stops matching, and the finding surfaces.
  # rule 51 of 94:
  - id: SSTI_PAYLOAD_REFLECTED_NOT_EVALUATED
    why: The SSTI payload comes back verbatim, so no template engine evaluated it. CATS matches its "engine" keyword against our own seeded member role engineering_lead. Requiring the unevaluated payload in the body keeps a genuine evaluation (which would show the computed value instead) surfacing.
    when:
      fuzzer: SstiInjectionInStringFields
      result_reason: { contains: SSTI injection error detected }
      response_code: { in: [200, 201] }
      response_body: { contains: "83*97" }

  # rule 52: unknown request fields are dropped, not bound (run 20260730T174620Z)
  # MassAssignment injects fields like price/discountPercent and flags the 2xx.
  # TMI ignores unknown fields rather than binding them: 0 of 661 responses
  # echoed the injected field, so nothing was assigned and there is no mass
  # assignment. Staying permissive about unknown fields is the deliberate policy
  # choice here (the alternative, additionalProperties:false plus 400, is a
  # breaking change for clients).
  #
  # The /admin/ exclusion is forward-looking: no /admin/ path appears in this
  # bucket today, but silently accepting an undeclared field on a
  # privilege-bearing endpoint is exactly the case worth hearing about, so it
  # must not be swept up by this rule later.
  # rule 52 of 94:
  - id: UNDECLARED_FIELD_DROPPED_NOT_BOUND
    why: TMI ignores unknown request fields rather than binding them, so MassAssignment's injected fields are dropped, not assigned. Verified on run 20260730T174620Z - 0 of 661 responses echoed the injected field. Excludes /admin/ so silent acceptance on privilege-bearing endpoints still surfaces.
    when:
      fuzzer: MassAssignment
      result_reason: { equals: Undeclared field accepted }
      contract_path: { matches: "^(?!/admin/)" }

  # rules 53-59: correct 4xx rejections the fuzzer expected to succeed
  # (run 20260730T174620Z). Each is keyed on the specific error the server
  # returned rather than on the fuzzer name, so an unrelated 400/409 on the same
  # path still surfaces. CATS expects 2xx from these fuzzers because it does not
  # model nested schema constraints or resource state.

  # rule 53 of 94:
  - id: NESTED_SCHEMA_VALIDATION_400
    why: The fuzzer mangled a nested object (color_palette colour pattern, cvss score range, diagram cells) and the server rejected it against the schema. A 400 is correct; CATS expected 2xx because it does not model nested constraints.
    when:
      response_code: 400
      json_body.error_description: { contains: 'multiple errors encountered: Error at "/' }

  # rule 54 of 94:
  - id: SCREENSHOT_BASE64_INVALID_400
    why: The fuzzer corrupted the base64 screenshot payload and the server rejected it. A 400 is the correct response to undecodable base64.
    when:
      response_code: 400
      json_body.error_description: { contains: "screenshot base64 body is not valid" }

  # This one is the SSRF protection reporting itself. api/ssrf_validator.go
  # resolves the host and checks every returned IP against the blocklist, and
  # api/safe_http_client.go then dials the validated IP rather than re-resolving,
  # so the lookup cannot be raced. Refusing a host it cannot resolve is the
  # control working, not a finding.
  # rule 55 of 94:
  - id: SSRF_URI_VALIDATION_REJECTS_UNRESOLVABLE_400
    why: The URI validator refuses a host it cannot resolve, which is the SSRF protection working (api/ssrf_validator.go resolves and checks every IP against the blocklist). The fuzzer supplies random hostnames, so a 400 is correct.
    when:
      response_code: 400
      json_body.error_description: { contains: "invalid uri: cannot resolve hostname" }

  # rule 56 of 94:
  - id: PAGINATION_CURSOR_INVALID_400
    why: The fuzzer corrupted an opaque pagination cursor; rejecting it with 400 is correct.
    when:
      response_code: 400
      json_body.error_description: { contains: "Invalid pagination cursor" }

  # rule 57 of 94:
  - id: METADATA_KEY_CONFLICT_409
    why: The fuzzer reuses one metadata key across repeated requests, so the second write is a genuine conflict. 409 is the correct optimistic-concurrency outcome.
    when:
      response_code: 409
      json_body.error_description: { contains: "Metadata key already exists" }

  # rule 58 of 94:
  - id: RESTORE_NON_DELETED_ENTITY_409
    why: Restore only applies to a soft-deleted entity; calling it on a live one is a state conflict, and 409 is correct.
    when:
      response_code: 409
      json_body.error_description: { contains: "not in a deleted state" }

  # rule 59 of 94:
  - id: SURVEY_THREAT_MODEL_ALREADY_CREATED_409
    why: A survey response yields at most one threat model; a second creation attempt is a genuine conflict and 409 is correct.
    when:
      response_code: 409
      json_body.error_description: { contains: "already been created from this survey" }

  # rule 60: SSE stream validated against a JSON schema (run 20260730T174620Z)
  # POST /threat_models/{id}/chat/sessions streams text/event-stream, which is
  # the only content type its 200 declares. CATS wraps the non-JSON body in a
  # notAJson envelope and then reports it does not match "the corresponding
  # schema" -- there is no application/json schema for it to match.
  # rule 60 of 94:
  - id: SSE_STREAM_VALIDATED_AS_JSON_SCHEMA
    why: "The endpoint streams text/event-stream exactly as the spec declares, and declares no application/json schema. CATS wraps the non-JSON body in a notAJson envelope and then reports it does not match a JSON schema that does not exist."
    when:
      result_reason: { equals: Not matching response schema }
      response_content_type: { contains: text/event-stream }

  # rule 61: XXE payloads stored as opaque note content (run 20260730T220551Z)
  # TMI has no XML parser; note `content` is a JSON string that is stored and
  # returned HTML-escaped. Verified across all 20 findings in the run: zero
  # responses expanded an entity (no XXE_TEST_SUCCESS, no /etc/* content) --
  # the payload comes back as "]&gt;&amp;test;".
  # rule 61 of 94:
  - id: XXE_NOTES_CONTENT_NOT_PARSED
    why: "Note content is stored as an opaque, HTML-escaped string and never parsed as XML. All 20 findings in run 20260730T220551Z returned the payload escaped with no entity expansion."
    when:
      result_reason: { equals: Potential XXE vulnerability detected }
      contract_path: { contains: /notes }

  # rule 62: mass assignment flagged on a declared, writable property
  # CATS treats a field named like `*_enabled` as privileged. `timmy_enabled`
  # is a documented, non-readOnly property of TeamProjectNoteBase and AssetBase,
  # so a client is supposed to be able to set it and see it echoed back.
  # rule 62 of 94:
  - id: MASS_ASSIGNMENT_DECLARED_WRITABLE_FIELD
    why: "timmy_enabled is a declared, non-readOnly property in the spec; the client is meant to set it. CATS flags it only because the name pattern looks privilege-like."
    when:
      result_reason: { equals: Mass Assignment vulnerability detected }
      response_body: { contains: timmy_enabled }

  # rule 63: mass assignment heuristic run against an SSE stream
  # POST /threat_models/{id}/chat/sessions streams text/event-stream. CATS wraps
  # the non-JSON body in a notAJson envelope, then runs its echo heuristic over
  # the raw stream text -- there is no JSON object whose fields could have been
  # mass-assigned.
  # rule 63 of 94:
  - id: MASS_ASSIGNMENT_SSE_STREAM_ENVELOPE
    why: "The endpoint streams text/event-stream as the spec declares. CATS wraps it in a notAJson envelope and runs a field-echo heuristic over stream text, where no assignable JSON object exists."
    when:
      result_reason: { equals: Mass Assignment vulnerability detected }
      response_body: { contains: notAJson }

  # rule 64: IDOR heuristic on a filtered list that returned nothing
  # CATS substitutes a foreign id into a list filter and flags the 200. The
  # response is an empty page (total 0) -- the filter matched no rows, so no
  # other user's data was disclosed. Scoped to total==0 so a response that
  # actually leaks rows still surfaces.
  # rule 64 of 94:
  - id: IDOR_EMPTY_RESULT_SET
    why: "The list endpoint returned an empty page (total 0) for the substituted id, so nothing was disclosed. Scoped to total==0 so any response that actually returns rows is still reported."
    when:
      result_reason: { equals: Potential IDOR vulnerability detected }
      json_body.total: { equals: 0 }

  # rule 65: cross-field business rule CATS cannot infer
  # POST /threat_models/{id}/feedback rejects target_field unless
  # target_type=threat_classification. That constraint is not expressible in
  # the schema, so CATS generates combinations the server correctly refuses.
  # rule 65 of 94:
  - id: FEEDBACK_TARGET_FIELD_CROSS_FIELD_400
    why: "target_field is only valid with target_type=threat_classification -- a cross-field rule not expressible in OpenAPI. The 400 is the server correctly rejecting a combination CATS cannot know is invalid."
    when:
      response_code: 400
      json_body.error_description: { contains: "target_field is allowed only for" }

  # rule 66: unknown field names with injected whitespace are ignored
  # The fuzzer renames a field (e.g. "description" -> "descr \tiption").
  # Go's decoder does not match the mangled key, so the field is ignored and the
  # resource is created without it. TMI declares no additionalProperties:false,
  # so accepting the request is the documented contract.
  #
  # Verified in run 20260730T220551Z: all 29 findings mangle an OPTIONAL field
  # only -- zero mangle a required field, so this never hides a required-field
  # validation bypass. RE-VERIFY that property before keeping this rule if the
  # request models change (a mangled required field must still yield 400).
  # rule 66 of 94:
  - id: WHITESPACE_FIELD_NAMES_IGNORED_2XX
    why: "A field name with injected whitespace is an unknown key, which the decoder ignores; TMI declares no additionalProperties:false so the 2xx is the documented contract. Verified all 29 findings mangled only optional fields -- no required field was bypassed."
    when:
      fuzzer: { equals: InsertWhitespacesInFieldNamesField }
      response_code: { in: [200, 201] }

  # rule 67: POST to an existing singleton resource
  # /me/preferences is a per-user singleton; POST creates and PUT updates. Once
  # the fuzzing identity has preferences, every later POST is correctly a 409.
  # rule 67 of 94:
  - id: PREFERENCES_ALREADY_EXIST_409
    why: "/me/preferences is a per-user singleton: POST creates, PUT updates. After the first successful POST every subsequent one is correctly a conflict."
    when:
      response_code: 409
      json_body.error_description: { contains: "preferences already exist" }

  # rule 68: free-form preferences payload echoed back
  # UserPreferences is declared additionalProperties: {type: object,
  # additionalProperties: true} with maxProperties 20, so arbitrary client keys
  # holding arbitrary objects are the design. The server still enforces the 1KB
  # size, the 20-client cap and the ^[a-zA-Z0-9_-]{1,64}$ key pattern in
  # api/user_preferences_handlers.go, so this is not unbounded storage.
  # rule 68 of 94:
  - id: PREFERENCES_FREEFORM_JSON_ECHO
    why: "UserPreferences declares free-form per-client objects, so echoing an arbitrary JSON payload is correct. Size, client-count and key-pattern limits are still enforced server-side."
    when:
      contract_path: { equals: /me/preferences }
      method: { equals: PUT }
      response_code: 200

  # rule 69: restore of a threat model that is not deleted
  # Supersedes the wording in the older "not in a deleted state" rule, which no
  # longer matches -- the server now answers "Threat model is not deleted".
  # rule 69 of 94:
  - id: THREAT_MODEL_RESTORE_NOT_DELETED_409
    why: "Restoring a threat model that was never deleted is correctly a conflict. The existing 'not in a deleted state' rule no longer matches the server's current wording."
    when:
      response_code: 409
      json_body.error_description: { contains: "is not deleted" }

  # rule 70: cross-provider SAML user listing is refused with 403, not 404
  # RandomResources substitutes a nonexistent idp into the path and expects a
  # 404. ListSAMLUsers (api/saml_user_handlers.go) compares the requested idp
  # against the caller's own provider *before* looking anything up, so every
  # foreign idp -- existent or not -- gets the same 403. That is deliberate:
  # answering 404 for an unknown provider and 403 for a known one would turn
  # this endpoint into a provider-existence oracle. This only became reachable
  # in 1.6.4; before #650 the route returned 401 to everyone.
  # rule 70 of 94:
  - id: SAML_USERS_CROSS_PROVIDER_403
    why: "Cross-provider SAML user listing is correctly 403, and deliberately does not distinguish a nonexistent provider from a foreign one -- 404 here would leak which providers exist. RandomResources expects 404."
    when:
      contract_path: { equals: "/saml/providers/{idp}/users" }
      method: { equals: GET }
      response_code: 403
      json_body.error_description: { contains: "different SAML provider" }

  # ==== 1.7.1 CATS triage (run 20260802T184152Z) ====

  # openapi3filter rejected a fuzzed request that violates the OpenAPI request
  # schema (bad enum in /type, wrong query-param value, etc.). 400 is documented
  # on these operations; the rejection is correct.
  # rule 71 of 94:
  - id: OPENAPI3FILTER_REQUEST_VALIDATION_400
    why: "openapi3filter rejected a request that violates the OpenAPI request schema (bad enum/type/query param). 400 documented; correct validation. Input-mutation fuzzers expect 2xx."
    when:
      response_code: 400
      json_body.error_description: { contains: "openapi3filter" }

  # A threat-model authorization array with duplicate subjects is correctly
  # rejected. 400 documented; HappyPath/boundary fuzzers built duplicates.
  # rule 72 of 94:
  - id: DUPLICATE_AUTHZ_SUBJECT_400
    why: "Server correctly rejects an authorization array with duplicate subjects. 400 documented; fuzzers built duplicate subjects and expected 2xx."
    when:
      response_code: 400
      json_body.error_description: { contains: "Duplicate authorization subject" }

  # Conditionally-required field enforcement (target_field required when
  # target_type=threat_classification). RemoveFields dropped the field.
  # rule 73 of 94:
  - id: CONDITIONAL_REQUIRED_FIELD_400
    why: "Server correctly enforces a conditionally-required field. 400 documented; RemoveFields dropped the field and expected 2xx."
    when:
      response_code: 400
      json_body.error_description: { contains: "is required for target_type" }

  # A survey response not in draft/needs_revision is immutable; update attempts
  # correctly conflict. 409 documented.
  # rule 74 of 94:
  - id: SURVEY_RESPONSE_STATUS_LOCKED_409
    why: "A survey response outside draft/needs_revision is correctly immutable; update attempts conflict. 409 documented."
    when:
      response_code: 409
      json_body.error_description: { contains: "Can only update responses in draft or needs_revision" }

  # Bulk create with an example id that already exists is correctly a conflict.
  # rule 75 of 94:
  - id: BULK_RESOURCE_ALREADY_EXISTS_409
    why: "Creating a resource whose id already exists is correctly a conflict. 409 documented; ExamplesFields reused a seeded id."
    when:
      response_code: 409
      json_body.error_description: { contains: "resource already exists" }

  # Response body conforms, but CATS' networknt validator trips on
  # additionalProperties:false-under-allOf and oneOf/discriminator (issue #674).
  # Verified conformant three ways on exactly these paths. Scoped to 2xx so the
  # /oauth2/authorize 404 (different cause) is not matched here.
  # rule 76 of 94:
  - id: RESPONSE_SCHEMA_COMPOSITION_FP_674
    why: "Response body conforms; CATS' validator mishandles additionalProperties:false-under-allOf and oneOf/discriminator (issue #674). Verified conformant on these paths."
    when:
      result_reason: { equals: "Not matching response schema" }
      response_code: { in: [200, 201] }
      contract_path:
        in:
          - "/intake/survey_responses/{survey_response_id}"
          - "/threat_models/{threat_model_id}/audit_trail/{entry_id}/rollback"
          - "/threat_models/{threat_model_id}/diagrams/{diagram_id}/model"
          - "/threat_models/{threat_model_id}/documents"
          - "/threat_models/{threat_model_id}/repositories/bulk"

  # /oauth2/authorize correctly redirects to the client callback; the 404 + HTML
  # body is emitted by the (non-running) callback stub, not TMI.
  # rule 77 of 94:
  - id: OAUTH_AUTHORIZE_CALLBACK_404_FP
    why: "The 404/HTML is from the client callback stub reached via redirect, not TMI. /oauth2/authorize redirected correctly."
    when:
      contract_path: { equals: "/oauth2/authorize" }
      response_code: 404
      response_body: { contains: "Cannot GET" }

  # Body-optional action endpoints (collaborate, chat/sessions, rollback) ignore
  # a garbage request body and succeed.
  # rule 78 of 94:
  - id: INVALID_JSON_IGNORED_ON_ACTION_2XX
    why: "Body-optional action endpoints ignore a garbage request body and succeed; 2xx is correct."
    when:
      response_code: { in: [200, 201] }
      fuzzer: { equals: RandomDummyInvalidJsonBody }
      contract_path:
        in:
          - "/threat_models/{threat_model_id}/diagrams/{diagram_id}/collaborate"
          - "/threat_models/{threat_model_id}/chat/sessions"
          - "/threat_models/{threat_model_id}/audit_trail/{entry_id}/rollback"

  # Injected template expression is stored/echoed verbatim (response still
  # contains raw ${...}); no evaluation. A real evaluated SSTI would not echo the
  # literal ${ and stays surfaced.
  # rule 79 of 94:
  - id: SSTI_TEMPLATE_STORED_VERBATIM_FP
    why: "Template payload stored/echoed verbatim (response contains raw ${...}); no evaluation. A real evaluated SSTI would not contain the literal ${ and is not matched."
    when:
      response_code: { in: [200, 201] }
      fuzzer: { equals: SstiInjectionInStringFields }
      response_body: { contains: "${" }

  # An empty request body on a write is correctly rejected with 400.
  # rule 80 of 94:
  - id: EMPTY_BODY_REJECTED_400
    why: "A write with an empty body is correctly rejected with 400; EmptyBody fuzzer expects 2xx."
    when:
      fuzzer: { equals: EmptyBody }
      response_code: 400

  # The diagram fixture was not actually deleted during the run (returns 200 to
  # the model GET later), so its metadata correctly returns 200.
  # rule 81 of 94:
  - id: DELETED_CHECK_LIVE_DIAGRAM_METADATA_200
    why: "Diagram fixture was not actually deleted (returns 200 to model GET later); its metadata correctly returns 200. Delete precondition unmet."
    when:
      fuzzer: { equals: CheckDeletedResourcesNotAvailable }
      response_code: 200
      contract_path: { equals: "/threat_models/{threat_model_id}/diagrams/{diagram_id}/metadata" }

  # -- permissive-input acceptance, split per fuzzer (was one bundled rule) --

  # TMI accepts and ignores unknown extra fields (request schemas are not
  # additionalProperties:false); a 2xx from NewFields is correct.
  # rule 82 of 94:
  - id: UNKNOWN_FIELDS_ACCEPTED_2XX
    why: "TMI accepts and ignores unknown extra fields; a 2xx from NewFields is correct permissive behavior, not a defect."
    when:
      response_code: { in: [200, 201] }
      fuzzer: { equals: NewFields }

  # String `format` is an annotation, not enforced on free-text fields; accepting
  # a wrong-format value with 2xx is by design.
  # rule 83 of 94:
  - id: STRING_FORMAT_NOT_ENFORCED_2XX
    why: "String format is advisory on free-text fields; accepting a wrong-format value with 2xx is by design."
    when:
      response_code: { in: [200, 201] }
      fuzzer:
        in:
          - StringFormatAlmostValidValues
          - StringFormatTotallyWrongValues

  # Free-text fields have no maxLength; accepting very large (unicode) strings
  # with 2xx is by design.
  # rule 84 of 94:
  - id: LARGE_STRINGS_ACCEPTED_2XX
    why: "Free-text fields are unbounded by design; accepting very large strings with 2xx is correct."
    when:
      response_code: { in: [200, 201] }
      fuzzer:
        in:
          - VeryLargeStringsInFields
          - VeryLargeUnicodeStringsInFields

  # Zero-width characters in header values are tolerated; a 2xx is correct.
  # rule 85 of 94:
  - id: ZEROWIDTH_HEADER_TOLERATED_2XX
    why: "Zero-width characters in header values are tolerated; a 2xx is correct, not a defect."
    when:
      response_code: { in: [200, 201] }
      fuzzer: { equals: ZeroWidthCharsInValuesHeaders }

  # Homoglyph characters in a free-text (non-strict-enum) field are accepted.
  # rule 86 of 94:
  - id: HOMOGLYPH_FIELD_ACCEPTED_2XX
    why: "Homoglyph characters in a free-text field are accepted with 2xx; the targeted field is not a strict enum."
    when:
      response_code: { in: [200, 201] }
      fuzzer: { equals: HomoglyphEnumFields }

  # A dummy well-formed request on a no-required-body endpoint succeeds.
  # rule 87 of 94:
  - id: DUMMY_REQUEST_ACCEPTED_2XX
    why: "A dummy well-formed request on an endpoint without required-body fields succeeds; 2xx is correct."
    when:
      response_code: { in: [200, 201] }
      fuzzer: { equals: DummyRequest }

  # PATCH bodies may only touch a field allowlist; a JSON-Patch op targeting a
  # disallowed/garbage field path is correctly rejected with 400.
  # rule 88 of 94:
  - id: PATCH_FIELD_NOT_ALLOWED_400
    why: "PATCH enforces a field allowlist; a JSON-Patch op on a disallowed/garbage field path is correctly rejected. 400 documented; fuzzers sent mangled JSON Pointers."
    when:
      response_code: 400
      json_body.error_description: { contains: "is not allowed in PATCH requests" }

  # Feedback cross-field rule: false_positive_reason is only valid when
  # target_type=threat; other combinations are correctly rejected with 400.
  # rule 89 of 94:
  - id: FEEDBACK_CROSS_FIELD_TARGET_TYPE_400
    why: "Feedback cross-field validation (false_positive_reason valid only for target_type=threat) correctly rejects invalid combinations. 400 documented."
    when:
      response_code: 400
      json_body.error_description: { contains: "allowed only when target_type" }

  # Webhook-delivery worker endpoints authenticate by HMAC webhook signature,
  # which CATS cannot generate; 401 "Invalid webhook signature" is the
  # documented correct rejection. Coverage gap (a signing hook) tracked
  # separately.
  # rule 90 of 94:
  - id: WEBHOOK_SIGNATURE_401
    why: "Webhook-delivery endpoints require an HMAC signature CATS cannot generate; 401 'Invalid webhook signature' is the documented correct rejection (run 20260820T034449Z cluster 1)."
    when:
      response_code: 401
      path: { starts_with: "/webhook-deliveries/" }
      json_body.error_description: { contains: "Invalid webhook signature" }

  # POST .../test on an operator-pinned subscription is deliberately refused;
  # 403 documented, behavior unit-pinned. Real coverage restored by the
  # non-pinned per-path refData override.
  # rule 91 of 94:
  - id: PINNED_SUBSCRIPTION_TEST_403
    why: "Refusing test deliveries on operator-pinned subscriptions is deliberate, unit-pinned behavior; 403 documented (run 20260820T034449Z cluster 2)."
    when:
      response_code: 403
      contract_path: { equals: "/admin/webhooks/subscriptions/{webhook_id}/test" }
      json_body.error: { contains: "operator-pinned" }

  # Header/field fuzzers replay the run's shared base body; after the first
  # 201 creates the group, every replay gets the documented duplicate 409.
  # rule 92 of 94:
  - id: ADMIN_GROUPS_DUPLICATE_409
    why: "Header/field fuzzers replay the same base body; after the first 201 the duplicate-group rejection is the documented correct response (run 20260820T034449Z cluster 3)."
    when:
      response_code: 409
      method: POST
      path: { equals: "/admin/groups" }
      json_body.error: { equals: "duplicate_group" }

  # create_threat_model is one-shot: the first success transitions the survey
  # response out of ready_for_review, later calls correctly 409.
  # rule 93 of 94:
  - id: SURVEY_RESPONSE_ONE_SHOT_409
    why: "create_threat_model is one-shot per survey response; after the first success the status-guard 409 is the documented correct response (run 20260820T034449Z cluster 4)."
    when:
      response_code: 409
      contract_path: { equals: "/triage/survey_responses/{survey_response_id}/create_threat_model" }
      response_body: { contains: "ready_for_review" }

  # offset has minimum:0 and no documented maximum; an empty page for a
  # beyond-the-end offset is conformant pagination.
  # rule 94 of 94:
  - id: SAML_USERS_HUGE_OFFSET_200
    why: "offset has no documented maximum; an empty result page for an out-of-range offset is correct pagination, 200 documented (run 20260820T034449Z cluster 6)."
    when:
      response_code: 200
      contract_path: { equals: "/saml/providers/{idp}/users" }
      fuzzer: { in: [ExtremePositiveNumbersInIntegerFields, IntegerFieldsRightBoundary] }
