# Dependabot auto-merge
#
# Enables GitHub auto-merge on Dependabot PRs whose highest update type is
# patch or minor (grouped PRs report the highest type in the group). Major
# bumps are left for a human. The merge itself is performed by GitHub once
# the main ruleset's required checks pass, including "guard / Version Guard",
# which passes as long as the PR leaves the version files alone. The version
# itself is bumped after the merge by version-bump-bot (.github/workflows/
# version.yml); its push-to-main run reads VERSION_BUMP_APP_* from repository
# Actions secrets, not the Dependabot store.
#
# delete_branch_on_merge is on at the repo level, so the head branch goes
# away after the merge.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions

name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge (patch/minor)
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'ericfitz/tmi'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Skipped (major bump needs a human)
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "::notice::Major version bump — leaving for manual review."
