name: Dependency Bump (Claude)

on:
  schedule:
    - cron: '0 13 * * *'   # daily Dependabot-alert check (bumps only when open alerts exist)
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to bump (a branch name, or "all")'
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: deps-bump-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  discover:
    if: ${{ github.repository == 'ericfitz/tmi' }}
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.set.outputs.branches }}
    steps:
      - name: Mint GitHub App token (reads Dependabot alerts)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPS_BOT_APP_ID }}
          private-key: ${{ secrets.DEPS_BOT_APP_PRIVATE_KEY }}
      - id: set
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          set -euo pipefail
          all_branches() {
            gh api "repos/$REPO/branches" --paginate --jq '.[].name' | grep -E '^(main|dev/.*)$' || true
          }
          open_alerts_count() {
            gh api "repos/$REPO/dependabot/alerts?state=open&per_page=1" --jq 'length' 2>/dev/null || echo "ERR"
          }
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_BRANCH" != "all" ]; then
            LIST="$INPUT_BRANCH"
          elif [ "$EVENT" = "schedule" ] && [ "$SCHED" = "0 13 * * *" ]; then
            CNT="$(open_alerts_count)"
            if [ "$CNT" = "ERR" ]; then
              echo "::warning::Could not read Dependabot alerts. Ensure the GitHub App has 'Dependabot alerts: read' and the installation re-accepted the updated permission."
              LIST=""
            elif [ "$CNT" -gt 0 ] 2>/dev/null; then
              echo "Open Dependabot alerts present — running the full branch set."
              LIST="$(all_branches)"
            else
              echo "No open Dependabot alerts — nothing to do."
              LIST=""
            fi
          else
            LIST="$(all_branches)"                            # weekly schedule, or dispatch with branch=all
          fi
          BRANCHES="$(printf '%s\n' "$LIST" | jq -R . | jq -cs 'map(select(length > 0))')"
          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"
          echo "Discovered branches: $BRANCHES"

  bump:
    needs: discover
    if: ${{ needs.discover.outputs.branches != '[]' && needs.discover.outputs.branches != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover.outputs.branches) }}
    concurrency:
      group: deps-bump-run-${{ matrix.branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          # The headless agent runs with --dangerously-skip-permissions; do NOT
          # leave a push credential in its reach. The "Open PR" step authenticates
          # explicitly with the App token instead.
          persist-credentials: false

      # Go ships stdlib security fixes in PATCH releases, and the `toolchain`
      # line in go.mod is the floor that decides which Go every build actually
      # uses: CI reads it through `go-version-file: go.mod` below, and because
      # GOTOOLCHAIN is unset anywhere in this repo (so it defaults to `auto`)
      # the container builds auto-download that same toolchain — including
      # Dockerfile.server-oracle, which bootstraps an older Go and then fetches
      # the floor. Dependabot's gomod ecosystem only updates `require`
      # directives, so nothing was raising this floor; it silently aged until
      # govulncheck failed PR #751 with 7 REACHABLE stdlib CVEs.
      #
      # This runs BEFORE "Set up Go" on purpose, so setup-go installs the new
      # version directly instead of making every later `go` invocation
      # auto-download a second toolchain.
      #
      # Deliberately stays inside the current MINOR line (1.26.x -> newest
      # 1.26.z, never -> 1.27.0). Patch releases are the security-fix channel
      # and are safe to take mechanically; a minor-line jump is a real
      # migration and remains a human decision.
      - name: Bump Go toolchain floor to the latest patch release
        id: toolchain
        run: |
          set -euo pipefail
          note() { echo "bumped=false" >> "$GITHUB_OUTPUT"; }

          CURRENT="$(sed -n 's/^toolchain go\([0-9][0-9.]*\)[[:space:]]*$/\1/p' go.mod | head -1)"
          if [ -z "$CURRENT" ]; then
            echo "::notice::go.mod has no 'toolchain' line — nothing to raise."
            note; exit 0
          fi
          MINOR="${CURRENT%.*}"

          if ! FEED="$(curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
                        'https://go.dev/dl/?mode=json&include=all')"; then
            echo "::warning::Could not reach the go.dev release feed — leaving toolchain at go${CURRENT}."
            note; exit 0
          fi

          # Newest stable patch within the SAME minor line. sort -V rather than
          # trusting feed order, so a reordered feed cannot pick an older patch.
          LATEST="$(printf '%s' "$FEED" \
            | jq -r --arg p "go${MINOR}." \
                '.[] | select(.stable == true) | .version | select(startswith($p))' \
            | sed 's/^go//' | sort -V | tail -1)"
          if [ -z "$LATEST" ]; then
            echo "::warning::No stable go${MINOR}.x release in the feed — leaving toolchain at go${CURRENT}."
            note; exit 0
          fi

          if [ "$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -1)" = "$CURRENT" ]; then
            echo "toolchain go${CURRENT} is already the newest go${MINOR}.x — nothing to do."
            note; exit 0
          fi

          # Exactly one toolchain line exists; match the whole line so the dots
          # in the version are never treated as regex metacharacters.
          sed -i "s|^toolchain go.*|toolchain go${LATEST}|" go.mod
          if ! grep -qx "toolchain go${LATEST}" go.mod; then
            echo "::error::Failed to rewrite the toolchain line in go.mod."
            exit 1
          fi
          CHANGED="go.mod"

          # functions/certmgr is the one genuinely standalone Go module in the
          # repo (no `replace` back to root), so it carries its own toolchain
          # floor (#755). It is built by the OCI Functions builder image with
          # GOTOOLCHAIN=auto, which downloads the floor — keep it in step with
          # root. wstest and test/integration `replace` the root module and
          # inherit its constraints, so they deliberately carry no toolchain
          # line (decision recorded in #755).
          CERTMGR_MOD="functions/certmgr/go.mod"
          if [ -f "$CERTMGR_MOD" ] && grep -qE '^toolchain go' "$CERTMGR_MOD"; then
            sed -i "s|^toolchain go.*|toolchain go${LATEST}|" "$CERTMGR_MOD"
            if ! grep -qx "toolchain go${LATEST}" "$CERTMGR_MOD"; then
              echo "::error::Failed to rewrite the toolchain line in ${CERTMGR_MOD}."
              exit 1
            fi
            CHANGED="$CHANGED ${CERTMGR_MOD}"
          else
            echo "::notice::${CERTMGR_MOD} missing or has no 'toolchain' line — not raised."
          fi

          # Dockerfile.server-oracle bootstraps its own Go rather than using a
          # prebuilt Go image, so it carries a second copy of the version. Left
          # behind, GOTOOLCHAIN=auto still produces a correct build but downloads
          # the floor as a second toolchain mid-build -- and the gap only widens
          # as this job keeps raising the floor. Keep the two in step.
          DOCKERFILE="Dockerfile.server-oracle"
          if [ -f "$DOCKERFILE" ] && grep -qE '^ARG GO_VERSION=' "$DOCKERFILE"; then
            sed -i "s|^ARG GO_VERSION=.*|ARG GO_VERSION=${LATEST}|" "$DOCKERFILE"
            if ! grep -qx "ARG GO_VERSION=${LATEST}" "$DOCKERFILE"; then
              echo "::error::Failed to rewrite ARG GO_VERSION in ${DOCKERFILE}."
              exit 1
            fi
            CHANGED="$CHANGED ${DOCKERFILE}"
          else
            echo "::notice::${DOCKERFILE} has no 'ARG GO_VERSION=' line — only go.mod was raised."
          fi

          git config user.name "deps-bot"
          git config user.email "deps-bot@users.noreply.github.com"
          # shellcheck disable=SC2086  # CHANGED is a deliberate space-separated path list
          git add $CHANGED
          git commit -m "$(printf '%s\n' \
            "fix(deps): bump Go toolchain floor to ${LATEST}" \
            "" \
            "Go ships stdlib security fixes in patch releases. The toolchain line" \
            "in go.mod is the floor every build resolves against (CI via" \
            "go-version-file, container builds via GOTOOLCHAIN=auto), and nothing" \
            "else raises it -- Dependabot's gomod ecosystem only updates require" \
            "directives." \
            "" \
            "go${CURRENT} -> go${LATEST} (same minor line; a minor-version jump is" \
            "left as a deliberate human decision)." \
            "" \
            "Files raised together: ${CHANGED}" \
            "" \
            "Raised automatically by .github/workflows/deps-bump.yml.")"

          echo "Raised Go toolchain floor: go${CURRENT} -> go${LATEST} (${CHANGED})"
          {
            echo "bumped=true"
            echo "from=${CURRENT}"
            echo "to=${LATEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # A Go patch release breaking the build is rare but not impossible, and if
      # it happened the headless bump agent below would bisect the DEPENDENCY
      # updates looking for a cause that isn't there. Fail that case fast and
      # drop just the toolchain commit, leaving the dependency bump to proceed.
      - name: Verify the raised toolchain still builds
        if: ${{ steps.toolchain.outputs.bumped == 'true' }}
        env:
          TO: ${{ steps.toolchain.outputs.to }}
        run: |
          set -euo pipefail
          echo "Building with $(go version)"
          if ! { go build ./... && (cd functions/certmgr && go build ./...); } 2>&1 | tail -40; then
            echo "::warning::go${TO} does not build this tree — reverting the toolchain bump and continuing with dependency updates only."
            git revert --no-edit HEAD
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9   # pnpm-lock.yaml is lockfileVersion 9.0; package.json has no packageManager field
          run_install: false

      - name: Install Go quality tools
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          # golangci-lint via goinstall, pinned to the version tmi's security.yml uses
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Vendor the bump skill into the runner
        env:
          # Pin ericfitz/skills to a reviewed commit so the high-privilege agent
          # run below cannot execute an unreviewed change to the skill. Bump this
          # SHA deliberately when adopting skill updates.
          SKILL_SHA: "804ee39f7d594e896f6dab8501b59cb92556b8df"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --filter=blob:none https://github.com/ericfitz/skills "$tmp/skills"
          git -C "$tmp/skills" checkout -q "$SKILL_SHA"
          mkdir -p .claude/skills/bump
          cp -R "$tmp/skills/deps/skills/bump/." .claude/skills/bump/
          test -f .claude/skills/bump/SKILL.md && echo "skill vendored @ $SKILL_SHA"

      - name: Create working branch
        id: wb
        env:
          BASE: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          WB="deps/auto-bump/${BASE}/${{ github.run_id }}"
          git config user.name "deps-bot"
          git config user.email "deps-bot@users.noreply.github.com"
          git checkout -b "$WB"
          {
            echo "base=$BASE"
            echo "wb=$WB"
          } >> "$GITHUB_OUTPUT"

      - name: Run headless bump (commit only — no push, no PR, no session-completion)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Intentionally NO GH_TOKEN: the agent must not perform GitHub writes.
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty (secret missing on this ref)."
            exit 1
          fi
          claude -p "Run the dependency bump skill (/bump) on the CURRENT checked-out git branch ONLY. You are running UNATTENDED in CI under a STRICT scope. DO: apply only safe patch/minor dependency updates; run the project build/test/lint; bisect out any update that breaks them; make exactly ONE local commit with the safe updates; then STOP. DO NOT: push; run any session-completion / 'landing the plane' / end-of-session workflow; file or close GitHub issues; run a security review; open a pull request; switch branches; ask questions. A separate CI step handles pushing and the PR. If there are no safe updates, make NO commit and say so. Finally, print the manual-review plan for anything not auto-applied." \
            --dangerously-skip-permissions \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep" | tee /tmp/bump-plan.txt

      # Minted AFTER the agent step so the write-capable token never exists while
      # the --dangerously-skip-permissions agent is running. Ephemeral (~1h),
      # scoped to this App's Contents + Pull-requests permissions on this repo.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPS_BOT_APP_ID }}
          private-key: ${{ secrets.DEPS_BOT_APP_PRIVATE_KEY }}

      - name: Open PR if there are changes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE: ${{ steps.wb.outputs.base }}
          WB: ${{ steps.wb.outputs.wb }}
          REPO: ${{ github.repository }}
          TC_BUMPED: ${{ steps.toolchain.outputs.bumped }}
          TC_FROM: ${{ steps.toolchain.outputs.from }}
          TC_TO: ${{ steps.toolchain.outputs.to }}
        run: |
          set -euo pipefail
          if [ "$(git rev-list --count "origin/${BASE}..HEAD")" -eq 0 ]; then
            echo "No commits relative to ${BASE} — no safe updates. Skipping PR."
            exit 0
          fi
          # persist-credentials was false, so push with the App token explicitly.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${WB}"
          {
            echo "Automated dependency bump for \`${BASE}\` (safe patch/minor only)."
            echo
            echo "Generated by the \`deps:bump\` skill running headless in CI. Review before merging."
            echo
            if [ "${TC_BUMPED:-false}" = "true" ]; then
              echo "### Go toolchain floor raised: \`go${TC_FROM}\` → \`go${TC_TO}\`"
              echo
              echo "Go ships stdlib security fixes in patch releases, and this floor is what"
              echo "CI and the container builds resolve against. It is a **separate commit**"
              echo "from the dependency updates, so it can be dropped on its own if needed."
              echo
            fi
            echo '<details><summary>Skill output / manual-review plan</summary>'
            echo
            echo '```'
            tail -c 60000 /tmp/bump-plan.txt
            echo '```'
            echo '</details>'
          } > /tmp/pr-body.md
          gh pr create --repo "${REPO}" --base "${BASE}" --head "${WB}" \
            --title "chore(deps): automated bump for ${BASE}" \
            --body-file /tmp/pr-body.md \
            --label dependencies
