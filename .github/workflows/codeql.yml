# CodeQL Security Analysis
# Performs deep semantic code analysis to find security vulnerabilities
# https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors

name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: "0 0 * * 0"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [go]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Use custom configuration for query tuning and path exclusions
          config-file: .github/codeql/codeql-config.yml

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Provision generated client (tmi-clients)
        uses: actions/checkout@v7
        with:
          repository: ericfitz/tmi-clients
          path: .tmi-clients
          # Pinned: last tmi-clients commit containing go-client-generated/v1_6_0,
          # which go.mod still replaces to. Remove this ref when #722 migrates
          # cmd/dbtool to the current generated client.
          ref: eeda4f60618c2185362a665c054141b26892fd14  # = tag ci-pin-go-v1_6_0, last commit with v1_6_0
      - name: Point go.mod replace at the checked-out client
        run: sed -i 's|=> ../tmi-clients/|=> ./.tmi-clients/|' go.mod

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
