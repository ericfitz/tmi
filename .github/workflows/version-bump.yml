# Automatic semantic versioning (#627)
#
# The old design was a post-commit hook that amended the commit it just
# observed on `main`. That is unreachable under a PR-only branch-protection
# ruleset (contents pushed to main only via squash-merge, no bypass actors,
# so a local hook never runs against `main`) -- see scripts/hooks/post-commit
# for the full history.
#
# The replacement computes the bump from the PR TITLE (which becomes the
# squash-merge commit subject) and pushes the bump commit directly onto the
# PR's own branch. Squash-merge then lands exactly one commit per change,
# bump included, and there is no window where main's version drifts from
# what actually shipped.
#
# Two jobs:
#   - "Version Bump" (job id: bump) pushes the computed bump to same-repo PR
#     branches, using a GitHub App installation token (see the job's first
#     step) rather than GITHUB_TOKEN, so the push retriggers CI (#797).
#   - "Version Check" (job id: check) recomputes independently and FAILS if
#     the PR's version locations disagree with what the title implies. Runs
#     for fork PRs too (which "Version Bump" cannot push to). This is the
#     job name to add to the branch-protection ruleset's required checks.
#
# Known residual race (same one the old manual process had): two PRs open
# concurrently against the same base can both compute the same "next"
# version. Whichever merges second will look stale to "Version Check" against
# the new main until it re-runs (a push to the PR branch, e.g. a rebase,
# retriggers `synchronize` and recomputes). Not fully closed by this design;
# documented rather than solved, same as before.
#
# Decoupling (human decision, Eric 2026-09-28; see
# docs/superpowers/specs/2026-09-28-adr-versioning-docs-skip-and-schema-decoupling.md):
#   - A docs-only PR (every file changed vs the merge-base with `main` is
#     under docs/**, PROGRESS.md, or *.md anywhere) bumps nothing; its
#     versions must simply equal main's.
#   - Otherwise the SERVER version (.version, api/version.go) bumps per the
#     PR title on every PR, same as before.
#   - The OpenAPI SCHEMA version (api-schema/tmi-openapi.json info.version)
#     only bumps when the schema itself changed (diff vs the merge-base with
#     info.version excluded); `make generate-api` only reruns then too.
# "Changed vs the PR" is always computed against the merge-base with main,
# not main's current tip -- squash-merge applies only the PR's own diff, so
# comparing against a tip that has moved past the fork point would treat
# untouched files as changed. The *expected version values* still derive
# from main's current tip (self-healing on rebase), same residual race as
# above.
#
# Security note: the PR title and head branch name are attacker-influenceable
# (opened by anyone who can open a PR). Both are passed to shell steps only
# via `env:` and referenced as quoted `"$VAR"`, never interpolated directly
# into a `run:` block, to avoid script injection through a crafted title or
# branch name.

name: Version Bump

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: version-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bump:
    name: Version Bump
    # Fork PRs get a read-only GITHUB_TOKEN and cannot be pushed to; they
    # still get "Version Check" below. Loop prevention: the "Compute version
    # plan" step's skip_server/skip_schema outputs are what actually break
    # the loop -- after this job pushes a bump, .version (and/or info.version)
    # already equals expected, so the `synchronize` event that push
    # retriggers sees no diff and skips before doing any real work. (The
    # pull_request event payload has no head-commit message to gate on up
    # here, and using one would be wrong anyway: an "edited" PR-title event
    # after a bump has landed can legitimately need a second bump even though
    # the current HEAD commit is itself a chore(version) commit.)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      # The bump commit must NOT be pushed with GITHUB_TOKEN: pushes made with
      # it never start a fresh workflow wave, so the PR sat BLOCKED with none
      # of the required checks registered on the bumped SHA (#797). Pushing
      # with an installation token from the ericfitz-deps-bot App (the same
      # one deps-bump.yml already uses to open PRs; contents: write) makes the
      # resulting `synchronize` event trigger CI like any human push.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPS_BOT_APP_ID }}
          private-key: ${{ secrets.DEPS_BOT_APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          # Pin to the immutable head SHA rather than the (attacker-chosen)
          # branch name; PR_HEAD_REF below is still needed as the push target.
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          # The push in the final step inherits this credential.
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch base main
        run: git fetch origin main

      - name: Compute version plan
        id: plan
        run: |
          set -euo pipefail
          MB="$(git merge-base origin/main HEAD)"
          echo "Merge-base with main: $MB"
          CHANGED="$(git diff --name-only "$MB" HEAD)"
          echo "Changed files vs merge-base:"
          echo "$CHANGED"

          DOCS_ONLY="$(printf '%s\n' "$CHANGED" | scripts/ci-version-bump.sh is-docs-only)"
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"

          if [ "$DOCS_ONLY" = "true" ]; then
            echo "Docs-only PR -- no version bump needed."
            echo "skip_server=true" >> "$GITHUB_OUTPUT"
            echo "skip_schema=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git show origin/main:.version > /tmp/base.version
          git show origin/main:api-schema/tmi-openapi.json > /tmp/base-spec.json

          EXPECTED_SERVER="$(scripts/ci-version-bump.sh compute-version "$PR_TITLE" /tmp/base.version)"
          echo "expected_server=$EXPECTED_SERVER" >> "$GITHUB_OUTPUT"
          CURRENT_SERVER="$(jq -r '"\(.major).\(.minor).\(.patch)"' .version)"
          if [ "$CURRENT_SERVER" = "$EXPECTED_SERVER" ]; then
            echo "PR branch .version ($CURRENT_SERVER) already matches expected -- nothing to do."
            echo "skip_server=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_server=false" >> "$GITHUB_OUTPUT"
          fi

          EXPECTED_SCHEMA="$(scripts/ci-version-bump.sh compute-schema-version "$PR_TITLE" /tmp/base-spec.json api-schema/tmi-openapi.json)"
          echo "expected_schema=$EXPECTED_SCHEMA" >> "$GITHUB_OUTPUT"
          CURRENT_SCHEMA="$(jq -r '.info.version' api-schema/tmi-openapi.json)"
          if [ "$CURRENT_SCHEMA" = "$EXPECTED_SCHEMA" ]; then
            echo "PR branch OpenAPI info.version ($CURRENT_SCHEMA) already matches expected -- nothing to do."
            echo "skip_schema=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_schema=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.plan.outputs.skip_server == 'false' || steps.plan.outputs.skip_schema == 'false'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Version pinned deliberately: other oapi-codegen versions silently
      # miscompile api/api.go (UnderscoreMetadata rename regression). Only
      # needed when the schema itself is moving -- a server-only bump never
      # touches api-schema/tmi-openapi.json, so api/api.go stays untouched.
      - name: Install oapi-codegen (pinned)
        if: steps.plan.outputs.skip_schema == 'false'
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.1

      - name: Set up uv
        if: steps.plan.outputs.skip_server == 'false' || steps.plan.outputs.skip_schema == 'false'
        uses: astral-sh/setup-uv@v7

      - name: Apply server version bump
        if: steps.plan.outputs.skip_server == 'false'
        env:
          EXPECTED: ${{ steps.plan.outputs.expected_server }}
        run: scripts/ci-version-bump.sh apply-version "$EXPECTED"

      - name: Apply schema version bump
        if: steps.plan.outputs.skip_schema == 'false'
        env:
          EXPECTED: ${{ steps.plan.outputs.expected_schema }}
        run: scripts/ci-version-bump.sh apply-schema-version "$EXPECTED"

      - name: Regenerate embedded API spec
        if: steps.plan.outputs.skip_schema == 'false'
        run: make generate-api

      - name: Sanity build (confirms the version bump took)
        if: steps.plan.outputs.skip_server == 'false' || steps.plan.outputs.skip_schema == 'false'
        run: make build-server

      - name: Verify embedded spec version matches
        if: steps.plan.outputs.skip_schema == 'false'
        env:
          EXPECTED: ${{ steps.plan.outputs.expected_schema }}
        run: |
          set -euo pipefail
          EMBEDDED="$(scripts/ci-version-bump.sh embedded-spec-version)"
          if [ "$EMBEDDED" != "$EXPECTED" ]; then
            echo "::error::Embedded spec version ($EMBEDDED) does not match expected schema version ($EXPECTED) after make generate-api."
            exit 1
          fi

      - name: Commit and push bump
        if: steps.plan.outputs.skip_server == 'false' || steps.plan.outputs.skip_schema == 'false'
        env:
          EXPECTED_SERVER: ${{ steps.plan.outputs.expected_server }}
          EXPECTED_SCHEMA: ${{ steps.plan.outputs.expected_schema }}
          SKIP_SERVER: ${{ steps.plan.outputs.skip_server }}
          SKIP_SCHEMA: ${{ steps.plan.outputs.skip_schema }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .version api/version.go api-schema/tmi-openapi.json api/api.go
          if [ "$SKIP_SERVER" = "false" ] && [ "$SKIP_SCHEMA" = "false" ]; then
            MSG="chore(version): bump server to $EXPECTED_SERVER, schema to $EXPECTED_SCHEMA"
          elif [ "$SKIP_SERVER" = "false" ]; then
            MSG="chore(version): bump to $EXPECTED_SERVER"
          else
            MSG="chore(version): bump OpenAPI schema to $EXPECTED_SCHEMA"
          fi
          git commit -m "$MSG"
          git push origin "HEAD:$PR_HEAD_REF"

  check:
    name: Version Check
    # Runs for every PR, including forks (which "Version Bump" cannot push
    # to). This is the check to make required in the branch-protection
    # ruleset -- it fails loudly instead of silently letting an unbumped or
    # mis-bumped PR merge.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base main
        run: git fetch origin main

      - name: Compute version plan
        id: plan
        run: |
          set -euo pipefail
          MB="$(git merge-base origin/main HEAD)"
          echo "Merge-base with main: $MB"
          CHANGED="$(git diff --name-only "$MB" HEAD)"
          echo "Changed files vs merge-base:"
          echo "$CHANGED"

          DOCS_ONLY="$(printf '%s\n' "$CHANGED" | scripts/ci-version-bump.sh is-docs-only)"
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"

          git show origin/main:.version > /tmp/base.version
          git show origin/main:api-schema/tmi-openapi.json > /tmp/base-spec.json

          if [ "$DOCS_ONLY" = "true" ]; then
            # Docs-only: no bump expected, versions must still equal main's.
            EXPECTED_SERVER="$(jq -r '"\(.major).\(.minor).\(.patch)"' /tmp/base.version)"
          else
            EXPECTED_SERVER="$(scripts/ci-version-bump.sh compute-version "$PR_TITLE" /tmp/base.version)"
          fi
          echo "expected_server=$EXPECTED_SERVER" >> "$GITHUB_OUTPUT"

          # compute-schema-version itself returns the base version unchanged
          # when the schema (excluding info.version) didn't change, so this
          # is correct for docs-only PRs too without special-casing them.
          EXPECTED_SCHEMA="$(scripts/ci-version-bump.sh compute-schema-version "$PR_TITLE" /tmp/base-spec.json api-schema/tmi-openapi.json)"
          echo "expected_schema=$EXPECTED_SCHEMA" >> "$GITHUB_OUTPUT"
          echo "Expected server version: $EXPECTED_SERVER (docs_only=$DOCS_ONLY)"
          echo "Expected schema version: $EXPECTED_SCHEMA"

      - name: Verify .version
        env:
          EXPECTED: ${{ steps.plan.outputs.expected_server }}
          DOCS_ONLY: ${{ steps.plan.outputs.docs_only }}
        run: |
          set -euo pipefail
          CURRENT="$(jq -r '"\(.major).\(.minor).\(.patch)"' .version)"
          if [ "$CURRENT" != "$EXPECTED" ]; then
            if [ "$DOCS_ONLY" = "true" ]; then
              echo "::error::.version is $CURRENT, expected $EXPECTED (docs-only PR -- must equal main's, no bump)."
            else
              echo "::error::.version is $CURRENT, expected $EXPECTED (derived from the PR title). Push a commit that bumps it, or let the Version Bump job do it (same-repo PRs only)."
            fi
            exit 1
          fi
          echo ".version OK: $CURRENT"

      - name: Verify OpenAPI info.version
        env:
          EXPECTED: ${{ steps.plan.outputs.expected_schema }}
        run: |
          set -euo pipefail
          CURRENT="$(jq -r '.info.version' api-schema/tmi-openapi.json)"
          if [ "$CURRENT" != "$EXPECTED" ]; then
            echo "::error::api-schema/tmi-openapi.json info.version is $CURRENT, expected $EXPECTED (schema version bumps only when the schema itself changes)."
            exit 1
          fi
          echo "OpenAPI info.version OK: $CURRENT"

      - name: Verify embedded spec version
        env:
          EXPECTED: ${{ steps.plan.outputs.expected_schema }}
        run: |
          set -euo pipefail
          EMBEDDED="$(scripts/ci-version-bump.sh embedded-spec-version)"
          if [ "$EMBEDDED" != "$EXPECTED" ]; then
            echo "::error::api/api.go's embedded OpenAPI spec has info.version $EMBEDDED, expected $EXPECTED. Run 'make generate-api' after bumping api-schema/tmi-openapi.json."
            exit 1
          fi
          echo "Embedded spec version OK: $EMBEDDED"
