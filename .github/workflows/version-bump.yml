# Automatic semantic versioning (#627), post-merge design.
#
# Human decision (Eric, 2026-10-02; supersedes the in-PR bump of 2026-09-28):
# docs/superpowers/specs/2026-10-02-adr-post-merge-version-bump.md
#
# PRs never touch version files. Bumping inside each PR made every pair of
# concurrent PRs conflict on .version/api/version.go, and the PR's own
# Version Check always failed once before the bump commit landed.
#
# Two jobs:
#   - "Version Check" (pull_request; the required check in the main ruleset)
#     fails only when a PR edits .version, api/version.go, or the OpenAPI
#     info.version itself, and confirms api/api.go's embedded spec matches
#     the spec file. It never depends on another job, so it cannot fail
#     transiently.
#   - "Version Bump" (push to main) folds every merged-but-unbumped
#     first-parent commit (scripts/ci-version-bump.sh plan-pending) and
#     pushes ONE chore(version) commit to main. Rules are unchanged: per
#     merged commit subject (= PR title), feat -> MINOR, else PATCH;
#     docs-only commits bump nothing; the schema version bumps only when that
#     commit changed the spec, with a `!` marker -> MAJOR.
#
# Why it cannot cascade (three independent guards; any one is enough):
#   1. The bump is pushed with GITHUB_TOKEN. GitHub does not start workflow
#      runs for pushes made with GITHUB_TOKEN, so the bump commit triggers
#      nothing at all.
#   2. The job is skipped when the pushed head commit is a chore(version)
#      commit.
#   3. plan-pending only counts commits after the last one that touched
#      .version. The bump commit touches .version, so a run that somehow saw
#      it would compute pending=0 and push nothing.
#
# Concurrency: runs are serialized (cancel-in-progress: false). GitHub keeps at
# most one pending run per group, so a burst of merges may skip intermediate
# runs; that is safe because each run folds ALL unbumped commits. If a push is
# rejected because a merge landed mid-run, that merge's own queued run bumps
# everything, so the rejected run just exits. Any other push rejection fails
# the job. workflow_dispatch re-runs the fold by hand.
#
# Pushing to main needs the GitHub Actions app (integration 15368) as a bypass
# actor on the main ruleset; only this job pushes with GITHUB_TOKEN.
#
# Security note: PR titles and commit subjects are attacker-influenceable.
# They reach shell steps only via env/git and are always quoted.

name: Version Bump

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Version Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base main
        run: git fetch origin main

      - name: PR must not edit version state
        run: |
          set -euo pipefail
          MB="$(git merge-base origin/main HEAD)"
          if ! BAD="$(scripts/ci-version-bump.sh check-pr-untouched "$MB" HEAD)"; then
            echo "::error::This PR edits version state that only the post-merge Version Bump may write: $(echo "$BAD" | paste -sd, -). Revert those changes; the version bumps automatically after merge."
            exit 1
          fi
          echo "No version files edited."

      - name: Embedded spec matches the spec file
        run: |
          set -euo pipefail
          SPEC="$(jq -r '.info.version' api-schema/tmi-openapi.json)"
          EMBEDDED="$(scripts/ci-version-bump.sh embedded-spec-version)"
          if [ "$EMBEDDED" != "$SPEC" ]; then
            echo "::error::api/api.go embeds OpenAPI info.version $EMBEDDED but api-schema/tmi-openapi.json says $SPEC. Run 'make generate-api'."
            exit 1
          fi
          echo "Embedded spec version OK: $EMBEDDED"

  bump:
    name: Version Bump
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(version)')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-bump-main
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Plan pending bump
        id: plan
        run: |
          set -euo pipefail
          scripts/ci-version-bump.sh plan-pending HEAD | tee -a "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.plan.outputs.pending != '0'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Version pinned deliberately: other oapi-codegen versions silently
      # miscompile api/api.go (UnderscoreMetadata rename regression).
      - name: Install oapi-codegen (pinned)
        if: steps.plan.outputs.pending != '0' && steps.plan.outputs.schema_changed == 'true'
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.1

      - name: Set up uv
        if: steps.plan.outputs.pending != '0'
        uses: astral-sh/setup-uv@v7

      - name: Apply server version
        if: steps.plan.outputs.pending != '0'
        env:
          SERVER: ${{ steps.plan.outputs.server }}
        run: scripts/ci-version-bump.sh apply-version "$SERVER"

      - name: Apply schema version and regenerate
        if: steps.plan.outputs.pending != '0' && steps.plan.outputs.schema_changed == 'true'
        env:
          SCHEMA: ${{ steps.plan.outputs.schema }}
        run: |
          set -euo pipefail
          scripts/ci-version-bump.sh apply-schema-version "$SCHEMA"
          make generate-api
          EMBEDDED="$(scripts/ci-version-bump.sh embedded-spec-version)"
          if [ "$EMBEDDED" != "$SCHEMA" ]; then
            echo "::error::Embedded spec version ($EMBEDDED) does not match $SCHEMA after make generate-api."
            exit 1
          fi

      - name: Sanity build
        if: steps.plan.outputs.pending != '0'
        run: make build-server

      - name: Commit and push bump
        if: steps.plan.outputs.pending != '0'
        env:
          SERVER: ${{ steps.plan.outputs.server }}
          SCHEMA: ${{ steps.plan.outputs.schema }}
          SCHEMA_CHANGED: ${{ steps.plan.outputs.schema_changed }}
          PENDING: ${{ steps.plan.outputs.pending }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .version api/version.go api-schema/tmi-openapi.json api/api.go
          if [ "$SCHEMA_CHANGED" = "true" ]; then
            MSG="chore(version): bump server to $SERVER, schema to $SCHEMA"
          else
            MSG="chore(version): bump to $SERVER"
          fi
          git commit -m "$MSG" -m "Folds $PENDING merged commit(s). [skip ci]"
          if git push origin HEAD:main; then
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]; then
            # A merge landed while this ran; its own queued run folds everything.
            echo "::notice::main moved during the bump; the next queued Version Bump run covers it."
            exit 0
          fi
          echo "::error::Push to main was rejected although main did not move. Check that the GitHub Actions app is a bypass actor on the main ruleset."
          exit 1
