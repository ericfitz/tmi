# Strategic-merge patch for the AWS (EKS) tmi-server Deployment.
#
# - env: `$patch: replace` swaps the ENTIRE dev env list for the AWS list —
#   the dev-only entries TMI_WEBHOOK_ALLOW_HTTP_TARGETS and
#   TMI_SSRF_WEBHOOK_ALLOWLIST=host.docker.internal (used only to reach the
#   host-run integration webhook receiver) are dropped. TMI_NATS_URL stays:
#   NATS runs in-cluster on AWS too.
#
#   AUTH POSTURE (internet-facing deployment): the runtime build mode is
#   PRODUCTION (TMI_BUILD_MODE=production, set in the terraform ConfigMap).
#   The dev-only "tmi" OAuth provider is NOT enabled here and NOT advertised in
#   the interactive providers list — in a production build its authorization-
#   code/login_hint flow is disabled anyway (auth/test_provider.go ExchangeCode
#   errors when !isDevOrTestBuild()), and service-account/client-credentials
#   auth does not depend on it being registered. Interactive human auth is
#   served entirely by the real OAuth/SAML providers (Google, GitHub, Microsoft,
#   Entra SAML) supplied via the `tmi-oauth-providers` secret (envFrom above).
#   First-user auto-promotion is OFF: TMI_AUTH_AUTO_PROMOTE_FIRST_USER="false"
#   in the ConfigMap (not overridden here), so admin comes solely from the
#   `administrators` setting (TMI_ADMIN_PROVIDER/_ID in the secret).
#   everyone_is_a_reviewer is true (set via the terraform
#   `everyone_is_a_reviewer` variable, decoupled from build mode) by deliberate
#   choice for this collaborative deployment.
#
#   TMI_DATABASE_URL and TMI_JWT_SECRET are explicit valueFrom.secretKeyRef
#   entries against the terraform-owned `tmi-secrets` Secret (see
#   kubernetes_secret_v1.tmi in terraform/modules/kubernetes/aws/k8s_resources.tf).
#   Both are REQUIRED by internal/config/config.go (server fails to start
#   without TMI_DATABASE_URL; JWT secret is validated at startup too) — do
#   not remove.
#
#   TMI_REDIS_PASSWORD is now also injected (#551). This REVERSES the previous
#   posture, in which redis ran with no requirepass and this variable was
#   deliberately omitted so the go-redis client would not send AUTH. The AWS
#   overlay's redis-auth.yaml patch now starts redis with
#   `--requirepass $(REDIS_PASSWORD)` from this same tmi-secrets key, so the
#   two sides must move together: injecting the password without the redis
#   patch (or vice versa) breaks every redis connection. Local dev
#   (docker-desktop / k3s) is unchanged and still runs redis unauthenticated —
#   only this overlay patches it.
#
#   Still deliberately explicit secretKeyRef entries rather than
#   `envFrom: secretRef: tmi-secrets`: sweeping the whole Secret in would also
#   pull in keys the server does not read, and explicit refs keep the blast
#   radius of a future key addition visible here.
#
#   TMI_SECRET_SETTINGS_ENCRYPTION_KEY (#547) turns on encryption of
#   secret-classified system settings at rest. The TMI_SECRET_ prefix is what
#   internal/secrets/env_provider.go looks for; without this var the server
#   stores OAuth client secrets as plaintext in RDS.
#
#   The terraform-owned `tmi-server-config` ConfigMap ALSO carries flat
#   TMI_* keys (TMI_BUILD_MODE, TMI_LOG_*, etc.), verified against the
#   `env:` struct tags internal/config/config.go actually reads (see the
#   inline citations in kubernetes_config_map_v1.tmi in
#   terraform/modules/kubernetes/aws/k8s_resources.tf; an earlier naming
#   mismatch there — e.g. TMI_AUTH_BUILD_MODE vs. the expected
#   TMI_BUILD_MODE — was fixed in commit c581c2ff). This patch wires that
#   ConfigMap in via `envFrom` below. Kubernetes resolves an explicit `env:`
#   entry ahead of `envFrom` for the same variable name, so the explicit
#   entries in this patch's `env:` list (TMI_SERVER_INTERFACE,
#   TMI_SERVER_PORT, TMI_REDIS_HOST, TMI_NATS_URL) keep taking effect unchanged;
#   envFrom activates the keys not listed there — TMI_BUILD_MODE
#   (="production"), TMI_AUTH_AUTO_PROMOTE_FIRST_USER (="false"),
#   TMI_AUTH_EVERYONE_IS_A_REVIEWER (="true"), and the TMI_LOG_* toggles.
#   The ConfigMap's `config.yml` key is not a
#   valid environment variable name and is silently skipped under envFrom
#   (a benign warning Event, not a failure).
# - serviceAccountName: tmi-api — the IRSA-annotated ServiceAccount terraform
#   creates (kubernetes_service_account_v1.tmi_api in
#   terraform/modules/kubernetes/aws/k8s_resources.tf), needed for the pod to
#   assume the IAM role that reads secrets from Secrets Manager.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tmi-server
spec:
  template:
    spec:
      serviceAccountName: tmi-api
      containers:
        - name: server
          envFrom:
            - configMapRef:
                name: tmi-server-config
            # Real OAuth/SAML provider config (Google/GitHub/Microsoft/Entra),
            # the admin identity (TMI_ADMIN_PROVIDER/_ID), and the callback/base
            # URLs. Created out-of-band by the operator from the source
            # deployment's provider config (secrets are never committed); this
            # envFrom makes it durable across overlay re-applies.
            - secretRef:
                name: tmi-oauth-providers
          env:
            - $patch: replace
            - { name: TMI_SERVER_INTERFACE, value: "0.0.0.0" }
            - { name: TMI_SERVER_PORT, value: "8080" }
            - { name: TMI_REDIS_HOST, value: "redis" }
            - { name: TMI_NATS_URL, value: "nats://nats.tmi-platform.svc:4222" }
            - { name: TMI_LOG_DIR, value: "/tmp/logs" }
            # The dev-only "tmi" provider is intentionally NOT enabled: on a
            # production build it is client-credentials-only, and the interactive
            # providers list must not advertise it. Service-account/client-
            # credentials auth does not require it to be registered.
            - name: TMI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tmi-secrets
                  key: TMI_DATABASE_URL
            - name: TMI_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tmi-secrets
                  key: TMI_JWT_SECRET
            # Must stay in lockstep with patches/redis-auth.yaml, which starts
            # redis with --requirepass from this same key (#551).
            - name: TMI_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tmi-secrets
                  key: TMI_REDIS_PASSWORD
            # Encrypts secret-classified settings at rest (#547).
            - name: TMI_SECRET_SETTINGS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: tmi-secrets
                  key: TMI_SECRET_SETTINGS_ENCRYPTION_KEY
